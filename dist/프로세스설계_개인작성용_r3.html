<!doctype html>
<html lang="ko">

<meta charset="utf-8" />
<!--
  process_board_v2 — 프로세스 설계 프론트엔드 (Streamlit 정적 커스텀 컴포넌트, npm 빌드 없음)

  ★ 기존 index.html 과의 핵심 차이:
    - 예전 보드는 "보이는 4컬럼"만 담고 이벤트 1건만 되돌렸다.
    - v2 는 전체 트리를 브라우저가 들고 편집하며, [저장] 시 tree 전체를 되돌린다.
      → 파이썬(app.py)이 store.save_tree 로 원자적 저장 + 스냅샷 + 충돌검사.
  ★ 모든 postMessage 에 isStreamlitMessage:true 필수. send() 한 곳에서만 postMessage.
  ★ 순서: componentReady → 부모 streamlit:render → setFrameHeight → (조작) setComponentValue.
  ★ render() 안에서는 setComponentValue 를 부르지 않는다(무한 리런). 사용자 조작에서만.
  ★ 파이썬이 넘겨주는 args: { tree:{nodes,domains,rev}, author, env, history:[], audit:[],
      flash:"", conflict:null|{...} }. 컴포넌트가 되돌리는 값: { type, evt_id, ... }.

  ★ 드래그(SortableJS, 로컬 번들 · MIT): 트리를 브라우저가 통째로 들고 있으므로 드래그는
    S.nodes 만 고치고 서버 왕복이 없다. group 을 레벨별(L3~L6)로 분리해 lv4 카드가 lv6
    컬럼에 떨어지는 사고를 구조적으로 막는다 — 같은 레벨끼리만 오가므로 레벨 변경·사이클이
    원천적으로 불가능하다. forceFallback: iframe 안에서 pointer 이벤트가 더 일관되고
    드래그 중 자동 스크롤을 얻는다(네이티브 dragenter 가 없어 강조는 :hover CSS 로 처리).
-->

    color: #1c1917; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; }
  .scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #d8cfc0; border-radius: 5px; }
  .app { display: flex; flex-direction: column; background: #eceae5; border-radius: 14px;
    overflow: hidden; border: 1px solid #ddd6ca; }
  /* 단독 배포판(Streamlit iframe 밖)은 창 전체를 채운다 — 모서리 라운드·테두리 제거해 딱 맞춤 */
  html.solo, html.solo body { height: 100%; overflow: hidden; }
  html.solo .app { border: none; border-radius: 0; }

  /* 상단바 */
  .top { display: flex; align-items: center; gap: 16px; padding: 11px 20px; background: #fff;
    border-bottom: 1px solid #e7e1d6; flex: none; flex-wrap: wrap; row-gap: 8px; }
  .top > * { flex: none; }
  .top .grow { flex: 1 1 auto; }
  .treewrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: #0f766e; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .btitle { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; line-height: 1.15; }
  .bsub { font-size: 12.5px; color: #a8a29e; font-weight: 600; }
  .tabs { display: flex; gap: 2px; background: #f0ede6; padding: 3px; border-radius: 9px; }
  .tab { padding: 6px 13px; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer;
    white-space: nowrap; color: #78716c; border: none; background: transparent; }
  .tab.on { background: #fff; color: #0f766e; box-shadow: 0 1px 3px rgba(28,25,23,.13); }
  .seg { display: flex; gap: 3px; background: #f0ede6; padding: 3px; border-radius: 9px; }
  .segb { padding: 6px 13px; border-radius: 7px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    color: #78716c; border: none; background: transparent; }
  .segb.on { background: #fff; color: #0f766e; box-shadow: 0 1px 3px rgba(28,25,23,.12); }
  .grow { flex: 1; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 5px 11px; background: #f0fdfa;
    border: 1px solid #99f6e4; border-radius: 9px; }
  .pill b { font-size: 13px; color: #115e59; }
  .pill span { font-size: 12.5px; color: #78716c; }
  .authwrap { display: flex; align-items: center; gap: 7px; }
  .authwrap label { font-size: 13px; color: #a8a29e; font-weight: 600; }
  .authinput { width: 104px; font-size: 14px; padding: 6px 9px; border: 1px solid #e7e1d6;
    border-radius: 8px; outline: none; }
  .authinput:focus { border-color: #0f766e; }
  .badge { font-size: 13.5px; font-weight: 700; padding: 6px 11px; border-radius: 9px; }
  .badge.clean { color: #78716c; background: #f0ede6; }
  .badge.dirty { color: #92400e; background: #fef3c7; border: 1px solid #fde68a; font-weight: 800; }
  .save { font-size: 14.5px; font-weight: 800; padding: 7px 16px; border-radius: 9px; border: none;
    color: #fff; }
  .save.on { background: #0f766e; cursor: pointer; }
  .save.off { background: #cabfb0; cursor: not-allowed; }
  .save.on:hover { filter: brightness(1.08); }

  .crumb { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 10px 20px;
    background: #faf8f3; border-bottom: 1px solid #f4f1ea; flex: none; }
  .chip { border-radius: 999px; padding: 3px 11px; font-size: 13.5px; font-weight: 700; }
  .chip.fix { background: #e7e1d6; color: #57534e; }
  .chip.cur { background: #0f766e; color: #fff; }
  .sep { color: #cabfb0; font-size: 14px; }
  .crumbtail { font-size: 13px; color: #a8a29e; }
  .crumbsel { border: 1px solid #99f6e4; border-radius: 999px; padding: 3px 12px; font-size: 13.5px;
    font-weight: 800; color: #0f766e; background: #f0fdfa; cursor: pointer; outline: none; }
  .crumbbtn { border: 1px solid #d8cfc0; border-radius: 999px; padding: 3px 9px; font-size: 13px;
    font-weight: 700; cursor: pointer; background: #fff; color: #57534e; margin-left: 4px; }
  .crumbbtn.add { border-color: #99f6e4; color: #0f766e; background: #f0fdfa; }
  .crumbbtn.del { border-color: #f0d9d9; color: #b91c1c; }
  .crumbbtn:hover { filter: brightness(.97); }
  .lv3chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lv3chip { border: 1.5px solid; border-radius: 999px; padding: 3px 11px; font-size: 13.5px;
    font-weight: 800; cursor: pointer; line-height: 1.3; }
  .lv3chip:hover { filter: brightness(.96); }
  /* ★ 미선택 칩까지 색을 채우면 여러 개가 선택된 것처럼 보인다(실제 사용자 혼동).
     미선택 = 흰 바탕 + 회색 글씨 + **색 점만** 남겨 부문 색은 유지하고, 선택 = 그 색으로 꽉 채운다. */
  .lv3chip .cdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    margin-right: 6px; vertical-align: middle; }
  .lv3chip.on { box-shadow: 0 0 0 2px rgba(15, 118, 110, .3); font-weight: 800; }
  .lv3mini { border: 1px solid #ddd6ca; background: #fff; border-radius: 999px; padding: 3px 10px;
    font-size: 12.5px; font-weight: 700; color: #57534e; cursor: pointer; }
  .lv3mini:hover { background: #faf8f3; }
  /* lv4 카드를 드래그하는 동안, 부문 칩이 '여기로 옮기기' 드롭 대상임을 표시 */
  body.dragL4 .lv3chip { outline: 2px dashed rgba(37, 99, 235, .45); outline-offset: 2px; }
  body.dragL4 .lv3chip:hover { outline-style: solid; outline-color: #2563eb; filter: brightness(1.02); }

  .body { flex: 1; display: flex; min-height: 0; }
  /* 보드는 컬럼 폭만큼만 차지(flex:0) → 남는 폭은 패널이 먹어 상세 입력이 넓어지고, 컬럼~패널 사이
     빈틈이 안 생긴다. 컬럼은 좁게 고정(basis 200, 필요 시 축소). */
  .board { flex: 0 1 auto; display: flex; gap: 12px; padding: 16px 16px 10px; min-width: 0; overflow-x: auto; }
  .col { flex: 0 0 194px; display: flex; flex-direction: column; background: #f8f6f1;
    border: 1px solid #ece6da; border-radius: 12px; overflow: hidden; }
  .col.wide { flex-basis: 233px; }   /* lv5·lv6 은 lv4(194) 의 1.2배 */
  .col.off { opacity: .6; }
  .colhead { display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 10px 12px; border-bottom: 1px solid #ece6da; }
  .colhead .t { font-size: 13.5px; font-weight: 800; color: #57534e; }
  .colhead .n { font-size: 13px; color: #a8a29e; font-weight: 700; }
  .list { flex: 1; overflow-y: auto; padding: 9px; display: flex; flex-direction: column; gap: 7px; }
  .emptyhint { color: #b8b0a4; font-size: 13.5px; padding: 14px 6px; text-align: center; line-height: 1.5; }
  .card { background: #fff; border: 1px solid #e7e1d6; border-left: 3px solid #cabfb0;
    border-radius: 10px; padding: 11px 13px; cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: #5eead4; }
  .card.sel { background: #f0fdfa; border-color: #0f766e; border-left-color: #0f766e;
    box-shadow: 0 2px 8px rgba(15,118,110,.12); }
  .card.path { background: #f7fdfc; border-left-color: #5eead4; }
  /* Ctrl+클릭으로 다중선택된 카드 — 함께 드래그된다 */
  .card.multisel { background: #eff6ff; border-color: #2563eb; border-left-color: #2563eb;
    box-shadow: 0 0 0 1.5px rgba(37, 99, 235, .35); }
  .card .top1 { display: flex; align-items: center; gap: 4px; }
  .card .nm { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-all; }
  /* 카드 이름 인라인 편집 — 평소엔 텍스트처럼, 올리면 테두리, 포커스 시 강조 */
  input.nm { width: 100%; min-width: 0; border: 1px solid transparent; background: transparent;
    border-radius: 6px; padding: 2px 5px; font-family: inherit; color: #1c1917; }
  input.nm::placeholder { color: #b8ab99; font-weight: 600; }
  input.nm:hover { border-color: #e7e1d6; background: #fdfcfa; }
  input.nm:focus { outline: none; border-color: #5eead4; background: #fff; box-shadow: 0 0 0 2px rgba(94, 234, 212, .35); }
  /* 카드 삭제 버튼 — 평소엔 옅게, 올리면 빨강 */
  .cdel { flex: none; border: none; background: transparent; color: #cabfb0; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 3px 4px; border-radius: 6px; }
  .cdel:hover { background: #fef2f2; color: #dc2626; }
  .ccopy { flex: none; border: none; background: transparent; color: #cabfb0; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 3px 4px; border-radius: 6px; }
  .ccopy:hover { background: #f0fdfa; color: #0f766e; }
  .rowdel { flex: none; border: none; background: transparent; color: #cabfb0; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .rowdel:hover { background: #fef2f2; color: #dc2626; }
  input.rowname { border: 1px solid transparent; background: transparent; border-radius: 6px;
    padding: 1px 4px; font-family: inherit; font-size: 14px; font-weight: 700; color: #1c1917; min-width: 120px; }
  input.rowname::placeholder { color: #b8ab99; }
  input.rowname:hover { border-color: #e7e1d6; background: #fff; }
  input.rowname:focus { outline: none; border-color: #5eead4; background: #fff; box-shadow: 0 0 0 2px rgba(94, 234, 212, .35); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; margin-top: 4px; flex: none;
    box-shadow: 0 0 0 3px #fef3c7; }
  .cdesc { margin-top: 3px; font-size: 12.5px; color: #a8a29e; line-height: 1.4; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .mc { font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; line-height: 16px; }
  .mc.ai { background: #dcfce7; color: #166534; font-weight: 800; }
  .mc.dept { background: #e0e7ff; color: #3730a3; }
  .mc.kids { background: #fff7ed; color: #9a3412; font-weight: 700; }
  .mc.n { background: #f0ede6; color: #57534e; }
  .mc.occ { background: #ede9fe; color: #5b21b6; font-weight: 700; }
  .mc.load { background: #ccfbf1; color: #0f766e; font-weight: 800; }
  .mc.auto { background: #fef9c3; color: #854d0e; }
  .mc.ship { background: #e0f2fe; color: #075985; }
  .mc.submit { background: #fce7f3; color: #9d174b; font-weight: 800; }
  .addbtn { border: 1.5px dashed #cabfb0; background: #fff; color: #78716c; border-radius: 8px;
    padding: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .addbtn:hover { border-color: #0f766e; color: #0f766e; background: #f0fdfa; }

  .revcap { font-size: 13px; font-weight: 700; color: #a8a29e; white-space: nowrap; }

  /* 연간 공수 — 1회 소요시간 × 연간 횟수 (읽기 전용 파생값) */
  .mh { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; padding: 9px 12px;
    background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 9px; }
  .mh b { font-size: 15.5px; font-weight: 800; color: #0f766e; }
  .mh span { font-size: 12.5px; color: #5eead4; font-weight: 600; }
  .solohint { font-size: 13.5px; color: #a8a29e; padding: 10px 2px 0; line-height: 1.6; }

  /* ── 검색 ── */
  .searchbox { position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
  .searchbox input { width: 190px; font-size: 14px; padding: 6px 10px; border: 1px solid #e7e1d6;
    border-radius: 8px; outline: none; background: #fff; color: #44403c; }
  .searchbox input:focus { border-color: #0f766e; }
  .searchbox .shits { font-size: 13px; font-weight: 800; color: #92400e; background: #fef3c7;
    border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  /* 검색어에 맞는 카드·행 강조 */
  .card.hit { box-shadow: 0 0 0 2px #f59e0b; }
  .row.hit { background: #fffbeb; }

  /* ── 확인 모달 (되돌릴 수 없는 조작) ── */
  .modalbg { position: fixed; inset: 0; background: rgba(28,25,23,.45); z-index: 900;
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #fff; border-radius: 14px; padding: 24px; max-width: 440px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,.24); }
  .modal .mtitle { font-size: 17px; font-weight: 800; color: #1c1917; }
  .modal .mbody { margin-top: 9px; font-size: 14.5px; color: #57534e; line-height: 1.6; }
  .modal .mbtns { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }
  .modal button { font-size: 14.5px; font-weight: 800; padding: 9px 16px; border-radius: 9px;
    border: none; cursor: pointer; }
  .modal .mcancel { background: #f0ede6; color: #57534e; }
  .modal .mdanger { background: #b91c1c; color: #fff; }

  /* ── 드래그 (SortableJS) ── */
  .card { cursor: grab; }
  body.dragging .card { cursor: grabbing; }
  .sgh { opacity: .35; }                                  /* 원래 자리 고스트 */
  .sch { box-shadow: 0 6px 18px rgba(15,23,42,.22); }     /* 집어든 카드 */
  /* 자식 드롭존 — 드래그 중, 받을 수 있는 레벨의 카드에서만 나타난다 */
  .cdrop { display: none; margin-top: 8px; border: 2px dashed #cabfb0; border-radius: 8px;
    min-height: 26px; background: #faf8f3; }
  .cdrop::after { content: "여기로 옮기기"; display: block; text-align: center;
    font-size: 11.5px; color: #b8b0a4; line-height: 22px; }
  body.dragL4 .cdrop.acc4, body.dragL5 .cdrop.acc5, body.dragL6 .cdrop.acc6, body.dragL7 .cdrop.acc7 { display: block; }
  /* forceFallback 이라 네이티브 dragenter 가 없다 — 고스트는 pointer-events 가 없어 :hover 가 걸린다 */
  body.dragging .cdrop:hover { border-color: #0f766e; background: #ccfbf1; }

  /* 아웃라인 */
  .outwrap { flex: 1; display: flex; flex-direction: column; padding: 16px; min-width: 0; }
  /* 전체보기 전용 — 좌측 트리를 넓힌다. 들여쓰기가 lv7 까지 가면(depth×20px) 이름 칸이 남지
     않아 lv6·lv7 이 전부 말줄임으로 뭉갰다. 컬럼 보기(.body 에 out 없음)는 컬럼이 스스로 폭을
     갖고 가로 스크롤을 쓰므로 그대로 둔다 — .panel 규칙을 전역으로 바꾸면 그쪽이 깨진다. */
  /* 전체보기 좌:우 = 5:3. flex-basis 를 0 으로 둬야 **전체 폭의 비율**이 된다 —
     auto 면 콘텐츠 폭이 섞여 비율이 틀어진다. 좁은 화면에서 min-width 가 비율을 이기는 건 의도된 동작. */
  .body.out .outwrap { flex: 5 1 0; }
  .body.out .panel { flex: 3 1 0; min-width: 320px; }
  /* 이름 칸이 남는 폭을 다 쓰게 한다 — 고정폭이면 트리를 넓혀도 이름은 그대로 뭉갠다.
     flex:1 이라 설명·배지는 오른쪽으로 밀려 붙고, 깊은 들여쓰기에서도 이름이 먼저 산다. */
  .body.out .rowname { flex: 1 1 auto; min-width: 260px; }
  .body.out .rowdesc { max-width: 300px; }
  .outcard { flex: 1; background: #fff; border: 1px solid #ece6da; border-radius: 12px; display: flex;
    flex-direction: column; overflow: hidden; min-height: 0; }
  .outhead { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    border-bottom: 1px solid #f4f1ea; flex: none; }
  .outhead .h1 { font-size: 14.5px; font-weight: 800; color: #44403c; }
  .outhead .h2 { font-size: 13px; color: #a8a29e; }
  .minibtn { font-size: 13px; font-weight: 700; color: #78716c; background: #f0ede6; border: none;
    border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  .minibtn.p { color: #fff; background: #0f766e; font-weight: 800; }
  .row { display: flex; align-items: center; border-radius: 8px; margin-bottom: 1px; }
  .row:hover { background: #faf8f3; }
  .row.sel { background: #f0fdfa; box-shadow: inset 3px 0 0 #0f766e; }
  .tog { width: 22px; text-align: center; font-size: 12px; color: #a8a29e; padding: 10px 0; flex: none; }
  .rowmain { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px; cursor: pointer; min-width: 0; }
  .lvb { font-size: 11px; font-weight: 800; padding: 2px 5px; border-radius: 4px; flex: none; }
  .lvb.d { background: #99f6e4; color: #115e59; }
  .lvb.g { background: #f0ede6; color: #78716c; }
  .rowname { font-size: 14.5px; font-weight: 600; color: #1c1917; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .rowdesc { font-size: 12.5px; color: #a8a29e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 240px; }
  .rowadd { font-size: 17px; font-weight: 800; color: #b8b0a4; background: transparent; border: none;
    cursor: pointer; padding: 4px 12px; }
  .rowadd:hover { color: #0f766e; }

  /* 사이드 패널 */
  .panel { flex: 1 1 520px; min-width: 480px; background: #fff; border-left: 1px solid #e7e1d6; display: flex;
    flex-direction: column; min-height: 0; }
  .phead { padding: 15px 18px; border-bottom: 1px solid #f4f1ea; }
  .phead.d { background: #f0fdfa; }
  .prow { display: flex; align-items: center; gap: 8px; }
  .ptag { font-size: 12px; font-weight: 800; color: #78716c; background: #f0ede6; padding: 2px 6px;
    border-radius: 5px; }
  .plv { font-size: 12.5px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
  .plv.d { background: #99f6e4; color: #115e59; }
  .plv.g { background: #f0ede6; color: #57534e; }
  .pdept { font-size: 12.5px; font-weight: 800; padding: 2px 9px; border-radius: 6px;
    background: #e0e7ff; color: #3730a3; }
  .pdept.none { background: #fef3c7; color: #92400e; }
  .punsaved { font-size: 12.5px; font-weight: 700; color: #92400e; background: #fef3c7; padding: 2px 7px;
    border-radius: 5px; }
  .pname { margin-top: 8px; font-size: 15.5px; font-weight: 800; line-height: 1.3; word-break: break-all; }
  .ppath { margin-top: 3px; font-size: 12.5px; color: #a8a29e; }
  .pbody { flex: 1; overflow-y: auto; padding: 16px 18px 22px; display: flex; flex-direction: column; gap: 11px; }
  .fl { font-size: 13.5px; font-weight: 700; color: #57534e; margin-bottom: 5px; }
  .fi { width: 100%; font-size: 15px; padding: 9px 11px; border: 1px solid #d8cfc0; border-radius: 9px; outline: none; }
  .fi:focus, .fa:focus, .fs:focus { border-color: #0f766e; }
  .fa { width: 100%; height: 50px; font-size: 14.5px; padding: 8px 11px; border: 1px solid #d8cfc0;
    border-radius: 9px; outline: none; resize: none; line-height: 1.5; }
  /* 읽기 전용 값 — 입력칸처럼 보이되 편집 불가(수행 과처럼 자동으로 채워지는 값) */
  .roval { font-size: 14.5px; padding: 8px 10px; border: 1px dashed #ddd6ca; border-radius: 8px;
    background: #faf8f3; color: #57534e; min-height: 37px; }

  /* 상세 폼 2열 배치 — 넓은 패널의 가로를 채운다.
     ★ flex:0 0 auto 다. 예전엔 `flex:1 1 auto; min-height:0` 이었는데, min-height:0 이
       flex 의 기본 보호막(min-height:auto)을 꺼서 패널이 짧을 때 이 박스가 **콘텐츠보다
       작게 눌렸다**. .pcol 에 overflow 가 없어 내용이 박스 밖으로 흘러나오고, 바로 다음
       형제인 '상위 업무 바꾸기' 블록과 같은 자리에 겹쳐 그려졌다(z-index 문제가 아니다).

  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; align-items: start; flex: 0 0 auto; }

  .aih { font-size: 12.5px; color: #a8a29e; margin-top: 1px; }

  .tchip { font-size: 13.5px; font-weight: 700; padding: 5px 11px; border-radius: 8px; cursor: pointer;

  .cardbox { background: #fff; border: 1px solid #ece6da; border-radius: 14px; overflow: hidden; }

  .usewrap { display: inline-flex; gap: 5px; }

  .tbl .tr { display: flex; justify-content: space-between; padding: 8px 15px; font-size: 14.5px; border-bottom: 1px solid #f7f4ee; }

  /* 요약 드릴다운 — 좌측 집계표의 숫자를 누르면 우측에 그 lv6 목록이 뜬다 */
  .clickable { cursor: pointer; }

  /* 좌: 좁은 그래프·목록 / 우: 상세가 남는 폭 전부 — 상세에 경로·기술·부하가 다 들어가야 한다 */
  .sumgrid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .sumgrid { grid-template-columns: minmax(0, 1fr); } }
  /* 우측 목록은 스크롤에 따라붙는다 — 아래 그래프를 보면서도 목록이 보이게 */
  .sumside { margin-top: 14px; background: #fff; border: 1px solid #ece6da; border-radius: 12px; overflow: hidden;

  .sumside.empty { padding: 22px 18px; font-size: 13.5px; color: #a8a29e; line-height: 1.7; text-align: center; }

  .sumhead b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sumhead span { flex: none; font-weight: 800; color: #0f766e; }
  .sumx { flex: none; border: none; background: none; cursor: pointer; color: #a8a29e; font-size: 14px; padding: 2px 4px; }
  .sumlist { overflow-y: auto; }
  /* 넓어진 폭을 쓰려고 2열 — 좌: 이름+경로 / 우: 소속·부하·AI. 좁아지면 1열로 떨어진다 */
  .sumrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 6px 16px;

    background: #faf8f3; border-bottom: 1px solid #f4f1ea; display: flex; align-items: center; gap: 8px; }

  .cgrp { font-size: 12.5px; font-weight: 800; color: #0f766e; background: #f7fdfc;

  .cgrp:first-child { margin-top: 0; border-top: none; }
  .brow { display: grid; grid-template-columns: 96px 1fr 58px; align-items: center; gap: 10px;
    padding: 3px 0; border-radius: 6px; }
  .brow:hover { background: #f5fbfa; }
  .brow.picked { background: #ecfdf5; }
  .brow .bl { font-size: 12.5px; color: #57534e; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; }
  .brow .bl:hover { color: #0f766e; text-decoration: underline; }
  .brow.picked .bl { font-weight: 800; }
  /* 막대 = 그 과의 전체 업무 수. 안쪽 두 구간(AI 적용 / 미적용)이 각각 클릭 대상이다. */
  .btrack { position: relative; height: 14px; background: #f0ede6; border-radius: 3px; overflow: hidden;

  .chatinput button { flex: none; padding: 0 22px; }
  .chipbtn { display: inline-block; margin: 4px; padding: 6px 12px; border-radius: 999px; cursor: pointer;

  .chipbtn:hover { background: #e7f6f4; border-color: #99f6e4; }

  .saverow { display: grid; grid-template-columns: 1.6fr .9fr 1.1fr .6fr auto auto; gap: 8px; align-items: center;

  /* 잠긴 노드 — 보이되 못 만진다. opacity 만으로는 클릭이 통과하므로 pointer-events 도 끈다.

  .card.locked, .row.locked { opacity: .48; }
  .card.locked .nm, .row.locked .rowname { pointer-events: none; background: transparent; border-color: transparent; }
  .card.locked .cdel, .card.locked .addbtn, .card.locked .ccopy,
  .row.locked .rowadd, .row.locked .rowdel { display: none; }

<script>
(function () {
  "use strict";

  // ── 모드 / Streamlit 프로토콜 ────────────────────────
  // 축이 둘이다. 하나로 뭉치면 "백엔드는 없지만 데이터는 진짜"인 개인 배포판을 표현할 수 없다.

    if (!val) { flash("값은 비울 수 없습니다"); rerender(refocus); return; }
    // 다른 행과 겹치는 이름은 거부 — 같은 값이 두 줄이면 어느 쪽을 쓰는지 알 수 없다
    var dup = (S.domains[key] || []).some(function (v, i) { return i !== idx && v === val; });
    if (dup) { flash("'" + val + "' 은(는) 이미 목록에 있습니다"); rerender(refocus); return; }

    S.domains[key][idx] = val;
    // ★ old 가 비어 있으면 노드를 건드리지 않는다. `n[key] === ""` 는 그 필드를 안 채운
    //   모든 노드와 일치해서, 전 노드에 새 값이 박힌다(실제로 13개 노드가 오염됐다).
    if (old) {
      var remap = function (arr) { return (arr || []).map(function (t) { return t === old ? val : t; }); };
      S.nodes.forEach(function (n) {
        if (key === "tech") { n.tech = remap(n.tech); n.future_tech = remap(n.future_tech); }   // 현재·향후 공유 도메인
        else if (key === "ship_type") n.ship_types = remap(n.ship_types);
        else if (key === "special_note") n.special_note = remap(n.special_note);
        else if (key === "linked_system") { if (n.linked_system === old) n.linked_system = val; (n.linked_systems || []).forEach(function (ls) { if (ls.system === old) ls.system = val; }); }
        // 부서/과는 **depts[] 가 집계의 정본**이다 — 대표값(dept)만 바꾸면 이름을 고쳐도
        // 과별·부서별 집계가 그대로여서 "바꿨는데 안 바뀐다"가 된다.

        else if (key === "dept") {

          n.depts = remap(n.depts);
          (n.submissions || []).forEach(function (r) { if (r && r.dept === old) r.dept = val; });
        }
        else if (n[key] === old) n[key] = val;
      });
    }
    // ★ AI 카운트 제외목록도 함께 따라가야 한다 — 안 그러면 이름을 바꾼 기술이 명단에서 빠져
    //   **AI 적용률이 조용히 올라간다**(depts remap 을 빠뜨려 겪은 것과 같은 종류의 버그).
    if (key === "tech" && old) {
      S.domains.tech_no_ai = (S.domains.tech_no_ai || []).map(function (t) { return t === old ? val : t; });

    rerender(refocus);
  }
  function domAdd(key) {
    var base = S.domains[key] || [], nm = "새 값", i = 2;
    while (base.indexOf(nm) >= 0) nm = "새 값 " + i++;   // 중복 없이 늘려간다
    S.domains[key] = base.concat([nm]); markDirty("dom"); rerender();
  }
  function domDelete(key, idx) { var v = S.domains[key][idx]; if (domUsage(key, v) > 0) { flash("사용 중이라 삭제할 수 없습니다"); return; } S.domains[key].splice(idx, 1);
    if (key === "tech") {   // 유령 항목이 제외목록에 남지 않게

  function doSave() {
    // 개인 모드에는 서버가 없다 — [저장] 은 "제출 파일 내보내기"다.
    // 편집 자체는 markDirty 마다 localStorage 에 자동 저장되므로 눌러야 안 날아가는 게 아니다.
    if (SOLO) return soloExport();
    if (!S.author) { flash("저장자를 먼저 입력하세요"); return; }
    if (!S.dirty.length) { flash("변경 사항이 없습니다"); return; }
    emit({ type: "save", rev: S.rev, author: S.author, nodes: S.nodes, domains: S.domains });
  }
  // ── 개인 모드(!IN_ST) — 파이썬·서버 없이 파일 하나로 도는 배포판 ──────────
  // 편집은 localStorage 에 자동 저장되고, [내 파일 내보내기] 로 JSON 을 받아 관리자에게 준다.
  var LS_PREFIX = "pd_solo_v1:";
  function lsKey() {
    // 같은 PC 를 여러 명이 써도 섞이지 않게 신원을 키에 넣는다
    return LS_PREFIX + ((S.dept || "-") + "|" + (S.author || "-"));
  }
  // 일괄 반영(붙여넣기·가져오기·취합) 전에 신원을 요구한다. **두 앱이 요구하는 것이 다르다**:
  //   · 개인 배포판 — 소속+이름. 둘 다 제출 파일명 구분자이고 소속은 봉투에 실린다.
  //   · 메인앱     — 저장자만. 소속은 취합 시 폴더 경로에서 오므로 상단에서 받을 이유가 없고,
  //                  받으면 새 노드에 관리자 소속이 섞인다(actAdd 주석 참조).
  function identReady() { return SOLO ? (!!S.dept && !!S.author) : !!S.author; }
  function needIdent() {
    if (identReady()) return true;
    flash(SOLO ? "먼저 상단에 소속과 이름을 지정하세요" : "먼저 상단에 저장자를 입력하세요");
    return false;
  }
  function soloSave() {
    if (IN_ST) return;
    try {
      localStorage.setItem(lsKey(), JSON.stringify({
        nodes: S.nodes, domains: S.domains, dept: S.dept, author: S.author, ts: Date.now(),
      }));
      localStorage.setItem(LS_PREFIX + "last", lsKey());
    } catch (e) { /* 용량 초과 등 — 저장 실패해도 편집은 계속돼야 한다 */ }
  }
  function soloLoad() {
    try {
      var k = localStorage.getItem(LS_PREFIX + "last");
      var raw = k && localStorage.getItem(k);
      if (!raw) return null;
      var d = JSON.parse(raw);
      return (d && d.nodes && d.nodes.length) ? d : null;
    } catch (e) { return null; }
  }
  function soloExportName() {
    var d = new Date(), p = function (x) { return String(x).padStart(2, "0"); };
    // 이름을 앞쪽 구분자로 — 취합 시 제출자 식별용. 이름 필수라 항상 들어간다.
    return "프로세스_" + (S.author || "이름") + "_" + (S.dept || "부서") + "_"
      + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".json";
  }
  /** 내보내기 — 전 lv6 에 **소속만** 주입한다(카드마다 다시 묻지 않는 이유).
   *  ★ 이름은 업무에 넣지 않는다 — 취합은 소속별 집계이고 이름은 필요 없다.
   *    누가 낸 파일인지는 파일명과 exported_by 로 충분하다. */
  function soloExport() {
    if (!S.dept || !S.author) { flash("상단에 소속과 이름을 먼저 입력하세요 (파일명 구분자)"); return; }
    // 같은 이름 형제(중복)가 있으면 내보내지 않는다 — 취합이 이름 경로로 병합해 데이터가 유실된다.
    var dups = dupSiblings();
    if (dups.length) {
      flash("같은 이름 항목이 " + dups.length + "곳 있어 내보낼 수 없습니다 — 이름을 수정하세요");
      rerender();
      return;
    }
    var mine = S.nodes.map(function (n) {
      var c = Object.assign({}, n);
      if (hasDetail(c.level)) { c.dept = S.dept; c.depts = [S.dept]; }
      // 취합 산출물은 메인앱이 만드는 것이라 개인 파일에 실어 보내지 않는다. 실으면 다음 취합에서
      // 남의 과 값이 내 제출본을 타고 되돌아온다(파이썬 parse_json 은 base 값을 살리므로 안전).
      c.submissions = []; c.submit_count = ""; c.submit_detail = "";
      c.updated_by = "";        // markDirty 가 찍어둔 이름 제거 — 업무 데이터에 이름을 남기지 않는다
      return c;
    });
    var payload = { schema_version: 1, exported_by: S.author, exported_dept: S.dept,
                    exported_at: new Date().toISOString(), nodes: mine, domains: S.domains };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = soloExportName();
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    S.exported = true; S.dirty = [];
    flash("내보냈습니다 — 이 파일을 관리자에게 전달하세요");
    rerender();
  }

  // ── 다운로드 — **브라우저에서(클릭 제스처 안에서) 바로** 만든다.
  //    파이썬이 만든 바이트를 리런 뒤 data-URI 로 자동클릭하던 방식은 최신 크롬이 '사용자 동작 없는
  //    샌드박스 iframe 다운로드'로 보고 막는다. 그래서 컴포넌트 안에서 Blob 으로 즉시 내려받는다.
  function _dl(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function _dateStamp() { var d = new Date(), p = function (x) { return String(x).padStart(2, "0"); }; return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
  //    UTF-8 BOM 을 붙여 엑셀에서 한글이 깨지지 않게 하고, 컬럼은 메인앱 엑셀과 맞춘다.
  var CSV_COLS = ["lv0", "lv1", "lv2", "lv3", "lv4", "lv5", "lv6", "lv7", "레벨", "이름",
    "부서/과", "수행과(전체)", "상위부서", "발생패턴", "기간단위", "횟수", "1회소요시간(h)", "연간공수(h)",
    "현재AI", "향후AI", "현재활용기술", "향후AI적용기술", "자동화수준", "적용선종", "특이사항",
    "반복구간", "산출물", "연계시스템(전체)", "업무설명"];
  function _csvCell(v) {
    v = (v == null) ? "" : String(v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function csvRows(mask) {
    var rows = [CSV_COLS.slice()];
    (function walk(pid, names) {
      childrenOf(pid).forEach(function (n) {
        var path = names.concat([n.name || ""]);
        var full = FIXED.concat(path);                 // lv0~lv2 고정단 재부착
        var lvc = []; for (var i = 0; i <= LEVEL_MAX; i++) lvc.push(full[i] || "");   // lv0~lv7
        var leaf = hasDetail(n.level);
        var dept = leaf ? (n.dept || S.dept || "") : (n.dept || "");   // lv6·lv7 은 소속(과) 반영
        var ship = leaf ? (n.ship_types || []).join(", ") : "";        // 도메인 값 그대로
        var links = leaf ? (n.linked_systems || []).map(function (ls) { return (ls.system || "") + (ls.detail ? " · " + ls.detail : ""); }).filter(Boolean).join(" / ") : "";
        // 수행과(전체) — 여러 과가 하는 업무는 과가 여럿이다(대표 과는 '부서/과' 열)
        var allDepts = leaf ? deptsOf(n).filter(function (d) { return d !== "(미지정)"; }).join(", ") : "";
        rows.push(lvc.concat([
          n.level, n.name || "", dept, allDepts, dept ? deptParent(dept) : "",
          leaf ? occurOf(n) : "", n.freq_unit || "", n.freq_count || "", n.work_hours || "",
          leaf && annualHours(n) ? annualHours(n) : "",
          leaf ? (n.has_ai_agent ? "Y" : "N") : "", leaf ? (n.has_ai_future ? "Y" : "N") : "",
          (n.tech || []).join(", "), (n.future_tech || []).join(", "), n.automation_level || "", ship,
          (n.special_note || []).join(", "), (n.apply_phases || []).join(", "),
          n.outputs || "", links, n.desc || "",
        ]));
        walk(n.id, path);
      });
    })(ROOT, []);
    return rows;
  }
  function csvDownload(mask, fname) {
    var rows = csvRows(mask);
    if (rows.length <= 1) { flash("내보낼 업무가 없습니다"); return; }
    var csv = rows.map(function (r) { return r.map(_csvCell).join(","); }).join("\r\n");
    _dl(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" }), fname);   // BOM = 엑셀 한글

  function jsonDownload() {   // 메인앱 JSON 원본 — 클라이언트에서 바로
    var payload = { schema_version: 1, exported_at: new Date().toISOString(), nodes: S.nodes, domains: S.domains };

  // 개인 배포판 버튼용 — 소속·이름을 파일명에 (담당자 필드는 폐지됐다)
  function soloCsvDownload() { csvDownload(false, "프로세스_" + (S.author || "이름") + "_" + (S.dept || "부서") + "_" + _dateStamp() + ".csv"); }

  function soloImport(text) {
    try {
      var d = JSON.parse(text);
      if (!d || !Array.isArray(d.nodes)) return flash("이 앱에서 내보낸 JSON 이 아닙니다");
      S.nodes = canonNodes(d.nodes.map(function (n) { return coerceEvents(Object.assign({}, n)); }));
      S.domains = withDefaultDomains(d.domains); recalcAi();   // 새 도메인 기본값 병합 + AI 파생 재계산

  function flash(msg) { S.flash = msg; renderFlash(); clearTimeout(flashTimer); flashTimer = setTimeout(function () { S.flash = ""; renderFlash(); }, 1900); }
  function renderFlash() { var ex = document.getElementById("flash"); if (ex) ex.remove(); if (S.flash) { var d = document.createElement("div"); d.id = "flash"; d.className = "flash"; d.textContent = S.flash; document.body.appendChild(d); } }

  // ── 뷰 (HTML 문자열) ────────────────────────────────

  function topbar() {

    var ident = SOLO
      ? '<div class="authwrap"><label>소속' + reqStar + '</label>' + deptSel + "</div>"
        + '<div class="authwrap"><label>이름' + reqStar + '</label><input class="authinput" data-fkey="author" value="' + esc(S.author) + '" placeholder="이름(필수)" /></div>'
      : '<div class="authwrap"><label>저장자' + reqStar + '</label><input class="authinput" data-fkey="author" value="' + esc(S.author) + '" placeholder="이름(필수)" title="저장 기록·스냅샷 파일명에 남습니다" /></div>';
    return '<div class="top">'
      + '<div class="brand"><div class="logo">🗂</div><div><div class="btitle">프로세스 설계' + (SOLO ? " · 개인 작성용" : "") + '</div><div class="bsub">조선소 시운전팀' + (S.env ? " · " + esc(S.env) : "") + '</div></div></div>'
      + '<div class="tabs">' + tabs + "</div>" + toggle
      + '<div class="grow"></div>'
      // 개인에겐 "AI 적용률"보다 "얼마나 채웠나 / 내 업무가 연간 몇 시간인가"가 쓸모 있다
      + (SOLO
          // 단위가 다른 값을 한 숫자로 합치지 않는다 (연간 vs 호선당)
          ? '<div class="pill"><b>연간 ' + st.hours + ' 시간</b><span>세부업무 ' + st.detail + "개"
            + (st.perShipHours ? " · 호선당 " + st.perShipHours + "시간" : "")
            + (st.unresolved ? " · 호선루틴 " + st.unresolved + "건" : "")
            + (st.hoursMissing ? " · 미완성 " + st.hoursMissing + "개" : "") + "</span></div>"
          // 현재(활용기술 보유)와 향후(향후 AI 적용기술 보유)를 한 숫자로 뭉치지 않는다 —
          // "지금 되는 것"과 "하려는 것"은 다른 이야기다. 분모는 둘 다 lv6 세부업무 수.
          : '<div class="pill"><b>AI 적용률 현재 ' + st.rate + '% · 향후 ' + st.rateFuture + '%</b>'
            + "<span>세부업무 " + st.detail + "개 중 현재 " + st.ai + "개 · 향후 " + st.aiFuture + "개</span></div>")
      + ident
      + (!SOLO && S.rev ? '<span class="revcap">rev ' + esc(S.rev) + "</span>" : "")
      + badge
      // v1 사이드바의 [↻ 디스크 다시 읽기] — 배너를 기다리지 않고 언제든 최신본을 받는다
      + (SOLO ? "" : '<button class="minibtn" data-act="reload" title="다른 사람이 저장한 최신 내용을 불러옵니다">↻ 다시 읽기</button>')
      + '<button class="save ' + (canSave ? "on" : "off") + '" data-act="save">'
      + (SOLO ? "⬇ 제출 파일 내보내기" : "💾 저장") + "</button>"
      + "</div>";
  }
  function banners() {
    var h = "";
    // 같은 이름 형제(중복) — 복사 후 이름을 안 바꾸면 뜬다. 취합이 이름 경로로 병합하므로 위험.
    var dups = dupSiblings();
    if (dups.length) {
      var items = dups.map(function (d) {
        var par = (d.parentId && d.parentId !== ROOT) ? byId(d.parentId) : null;
        return "'" + esc((par ? par.name + " › " : "") + d.name) + "' " + d.ids.length + "개";
      }).join(", ");
      h += '<div class="warn" style="margin:8px 14px 0;border-radius:10px">⚠ 같은 이름의 항목이 있습니다 — '
        + (SOLO ? '<b>내보내기 전에</b> ' : '') + '이름을 수정하세요: ' + items + "</div>";
    }
    // lv3 동명 부문 — 오타 교정(CEDAR CUS → CEDAR CSU) 뒤에 생길 수 있다. 위 가드는 lv5+ 라 안 잡힌다.
    // 자동 병합은 하지 않는다(부문 통합은 하위 전체가 움직이는 조작이라 사람이 판단해야 한다).
    var dup3 = dupSiblings(LEVEL_MIN).filter(function (d) { return Number(d.level) === LEVEL_MIN; });
    if (dup3.length) {
      h += '<div class="warn" style="margin:8px 14px 0;border-radius:10px">⚠ 이름이 같은 부문이 있습니다 — '
        + dup3.map(function (d) { return "'" + esc(d.name) + "' " + d.ids.length + "개"; }).join(", ")
        + ' · 상세 패널의 <b>상위 업무 바꾸기</b>로 한쪽 하위를 옮겨 합치세요.</div>';
    }
    if (S.conflict) {
      h += '<div class="banner conf"><b>' + esc(maskName(S.conflict.disk_author) || "다른 사람") + "</b> 님이 먼저 저장했습니다 (rev " + esc(S.conflict.disk_rev) + "). 자동 병합은 하지 않습니다."
        + '<span class="grow"></span>'
        + '<button data-act="reload">최신 불러오기</button><button data-act="force">내 것으로 덮어쓰기</button><button data-act="dismiss">취소</button></div>';
    } else if (S.diskNewer) {
      h += '<div class="banner info"><b>' + esc(maskName(S.diskNewer.author) || "다른 사람") + "</b> 님이 방금 저장했습니다 (rev " + esc(S.diskNewer.rev) + ")."
        + '<span class="grow"></span><button data-act="reload">↻ 디스크 다시 읽기</button></div>';
    }
    return h;
  }

  function columns() {
    // lv3(부문)은 빵부스러기 드롭다운으로 고른다 — 컬럼은 lv4~lv7 만 (lv3 컬럼 제거).
    var html = '<div class="board scroll">';
    // 대상 부문이 여럿이면 lv4 컬럼은 그 부문들의 대분류를 **모아** 보여준다.
    // ★ 이때는 읽기 전용 목록이다 — 컬럼은 `data-parent` 하나로 드롭 대상과 ＋ 의 부모를 정하는데,
    //   부모가 여럿이면 그 계약이 성립하지 않는다. 카드를 누르면 그 부문 하나로 좁혀진다(actSelect).
    var pick3 = pickedLv3();
    var multi3 = pick3.length > 1;
    // 대상이 정확히 하나면(칩 1개 선택 또는 범위에 걸리는 부문이 하나) 평소처럼 드릴다운한다.
    var only3 = pick3.length === 1 ? pick3[0].id : "";
    for (var lv = 4; lv <= LEVEL_MAX; lv++) {
      if (lv === 4 && multi3) {
        var agg = [];
        pick3.forEach(function (p3) { agg = agg.concat(visibleChildren(p3.id)); });
        html += '<div class="col"><div class="colhead"><span class="t">lv4 ' + esc(LABELS[4])
          + '</span><span class="n">' + agg.length + "</span></div>"
          + '<div class="list scroll">'
          + '<div class="emptyhint" style="text-align:left;padding:8px 10px;line-height:1.5">'
          + (scopeOn()
              ? "<b>" + esc(S.eDept || S.eGroup) + "</b> 업무가 있는 부문 " + pick3.length + "개를 모아 보는 중"
                + "<br/>부문 칩과 무관하게 전 부문에서 모읍니다"
              : "부문 " + pick3.length + "개를 함께 보는 중<br/>카드를 누르면 그 부문으로 좁혀집니다")
          + "</div>";
        agg.forEach(function (nn) { html += cardHTML(nn, 4); });
        html += "</div></div>";
        continue;
      }
      var pid = (lv === 4 && only3) ? only3 : S.sel[lv - 1];
      var enabled = !!pid;
      var kids = enabled ? visibleChildren(pid) : [];
      html += '<div class="col' + (lv > 4 ? " wide" : "") + (enabled ? "" : " off") + '"><div class="colhead"><span class="t">lv' + lv + " " + esc(LABELS[lv]) + '</span><span class="n">' + kids.length + "</span></div>"
        + '<div class="list scroll" data-lv="' + lv + '" data-parent="' + esc(pid || "") + '">';
      if (!enabled) html += '<div class="emptyhint">'
        + (lv === 4 ? (scopeOn() ? "이 범위에 해당하는<br/>업무가 없습니다" : "위에서 부문을<br/>먼저 고르세요")
                    : "상위 항목을<br/>먼저 선택하세요") + "</div>";
      else {
        kids.forEach(function (nn) { html += cardHTML(nn, lv); });
        html += '<button class="addbtn" data-act="add" data-pid="' + esc(pid) + '" data-lv="' + lv + '">＋ 새 ' + esc(LABELS[lv]) + "</button>";
      }
      html += "</div></div>";
    }
    return html + "</div>";
  }
  /** 취합 인원 배지(👥 N명)의 툴팁 — **어느 과가 얼마로 냈는지**.
   *
   *  ★ 제출자 **이름은 트리에 저장하지 않는다**(공통규칙 7 최소수집). collect_jsons 가 과만 남기고
   *    이름은 인원수를 세는 데만 쓰고 버린다. 그래서 여기 뜨는 것은 사람 이름이 아니라 과별 내역이다.
   *    이름을 보려면 취합 미리보기의 '파일별 상태' 를 봐야 한다(스캔 시점에만 존재).
   *  ★ 옛 트리·엑셀 왕복본에는 submissions 가 없어 예전의 한 덩어리 요약(submit_detail)으로 폴백한다. */
  function submitTip(nn) {
    var recs = (nn.submissions || []).filter(function (r) { return r && r.dept; });
    if (!recs.length) return nn.submit_detail || "";
    var lines = recs.map(function (r) {
      var bits = [r.dept + (r.author ? " " + maskName(r.author) : "") + " " + (r.count || 1) + "명"];
      if (r.work_hours) bits.push(r.work_hours + "h/회");
      if (r.freq_unit) bits.push(r.freq_unit + " " + (r.freq_count || "") + "회");
      if (r.automation_level) bits.push(r.automation_level);
      if ((r.tech || []).length) bits.push(r.tech.join(", "));
      return "· " + bits.join(" · ");
    });
    var dl = [];
    recs.forEach(function (r) { if (dl.indexOf(r.dept) < 0) dl.push(r.dept); });
    return "제출 " + recs.length + "건 · " + dl.length + "개 과 (이름은 마스킹해 표시합니다)\n" + lines.join("\n");
  }

  function cardHTML(nn, lv) {
    var detail = hasDetail(lv), chips = "";
    var _locked = !canEdit(nn);
    if (_locked) chips += '<span class="lockchip">🔒</span>';
    if (detail && nn.has_ai_agent) chips += '<span class="mc ai">AI</span>';
    if (detail) (nn.tech || []).slice(0, 2).forEach(function (t) { chips += '<span class="mc n">' + esc(t) + "</span>"; });
    if (detail && (nn.tech || []).length > 2) chips += '<span class="mc n">+' + ((nn.tech.length) - 2) + "</span>";
    if (detail && nn.dept) chips += '<span class="mc dept">' + esc(nn.dept) + "</span>";
    // 취합 인원수 배지 — lv4~6 어디서나(메인앱 취합 산출물). SOLO 노드는 값이 없어 안 뜬다.
    // ★ submissions 가 있으면 **그쪽 인원 합**이 정본이다 — 레코드를 고치거나 지워도 배지가 즉시
    //   따라온다(파이썬 normalize 도 같은 규칙으로 submit_count 를 재생성한다).
    //   submissions 가 없는 옛 트리·엑셀 왕복본은 저장된 submit_count 로 폴백한다.
    var _recs = (nn.submissions || []).filter(function (r) { return r && r.dept; });
    var _sc = _recs.length
      ? _recs.reduce(function (a, r) { return a + (parseInt(r.count, 10) || 1); }, 0)
      : parseInt(nn.submit_count, 10);
    if (_sc >= 2) {
      var _tip = submitTip(nn);
      chips += '<span class="mc submit"' + (_tip ? ' title="' + esc(_tip) + '"' : "")
             + ">👥 " + _sc + "명</span>";
    }
    // 개인 배포판 lv6 — 발생패턴·부하·자동화·선종을 카드에 요약해 세부 패널을 짧게 유지한다
    if (SOLO && detail) {
      var _p = occurOf(nn), _pl = { "상시루틴": "상시", "호선루틴": "호선R", "호선이벤트": "이벤트" }[_p] || _p;
      chips += '<span class="mc occ">' + esc(_pl) + "</span>";
      var _L = loadOf(nn);
      if (_L.kind === "annual" && _L.hours) chips += '<span class="mc load">연 ' + _L.hours + "h</span>";
      else if (_L.kind === "per_ship" && _L.hours) chips += '<span class="mc load">호선당 ' + _L.hours + "h</span>";
      else if (_L.kind === "unresolved") chips += '<span class="mc load">구간부하</span>';
      if (nn.automation_level) chips += '<span class="mc auto">' + esc(nn.automation_level) + "</span>";
      var _st = shipTypesOf(nn.id);
      if (_st.length) chips += '<span class="mc ship">' + esc(_st.join("·")) + "</span>";   // 선종 값=도메인값
    }
    var kids = childrenOf(nn.id).length;
    if (kids) chips += '<span class="mc kids">▸' + kids + "</span>";
    var sel = S.selectedId === nn.id;
    // 현재 선택 체인 위의 조상 카드는 옅게 강조(.path) — "지금 어느 경로를 쓰는지" 한눈에 보이게.
    var onPath = !sel && S.sel[lv] === nn.id;
    // lv6 아래는 없으므로 드롭존도 없다. 드롭존은 자기보다 한 단계 아래 레벨만 받는다.
    var drop = lv < LEVEL_MAX ? '<div class="cdrop acc' + (lv + 1) + '" data-parent="' + esc(nn.id) + '"></div>' : "";
    return '<div class="card' + (sel ? " sel" : onPath ? " path" : "") + (isHit(nn) ? " hit" : "")
      + (_locked ? " locked" : "") + '" data-act="select" data-id="' + esc(nn.id) + '" data-lv="' + lv + '">'
      // 이름은 카드에서 바로 편집(인라인 input), 삭제도 카드에서 바로. 둘 다 드래그/선택으로 새지 않게 처리.
      + '<div class="top1"><input class="nm" data-fkey="name" data-id="' + esc(nn.id) + '" value="' + esc(nn.name) + '" placeholder="' + esc(LABELS[lv]) + '명" />'
      + (S.dirty.indexOf(nn.id) >= 0 ? '<span class="dot" title="저장 안 됨"></span>' : "")
      + (lv >= 5 ? '<button class="ccopy" data-act="copy" data-id="' + esc(nn.id) + '" title="복사 — 하위 포함, 이름 수정 필요">⧉</button>' : "")
      + '<button class="cdel" data-act="del" data-id="' + esc(nn.id) + '" title="이 ' + esc(LABELS[lv]) + ' 삭제' + (kids ? " (하위 " + descCount(nn.id) + "개 포함)" : "") + '">🗑</button></div>'
      + (nn.desc ? '<div class="cdesc">' + esc(nn.desc) + "</div>" : "")
      + (chips ? '<div class="meta">' + chips + "</div>" : "")
      + drop
      + "</div>";
  }

  function outline() {
    var anyOpen = S.nodes.some(function (n) {
      return inEditScope(n) && visibleChildren(n.id).length && !S.collapsed[n.id];
    });
    var body = "";
    (function walk(pid, depth) {
      // 최상단(부문)은 칩으로 고른 것만, 그 아래는 편집 범위에 걸리는 가지만 그린다.
      var kids = (pid === ROOT) ? pickedLv3() : visibleChildren(pid);
      kids.forEach(function (nn) {
        var kids = childrenOf(nn.id), col = !!S.collapsed[nn.id], sel = S.selectedId === nn.id, detail = hasDetail(nn.level);
        var chips = "";
        if (detail && nn.has_ai_agent) chips += '<span class="mc ai">AI</span>';
        if (detail && nn.dept) chips += '<span class="mc dept">' + esc(nn.dept) + "</span>";
        // 취합 인원 배지 — 컬럼 보기(cardHTML)에만 있으면 전체보기에서 겹친 업무를 찾을 수 없다.
        var _orecs = (nn.submissions || []).filter(function (r) { return r && r.dept; });
        var _osc = _orecs.length
          ? _orecs.reduce(function (a, r) { return a + (parseInt(r.count, 10) || 1); }, 0)
          : parseInt(nn.submit_count, 10);
        if (_osc >= 2) {
          var _otip = submitTip(nn);
          chips += '<span class="mc submit"' + (_otip ? ' title="' + esc(_otip) + '"' : "")
                 + ">👥 " + _osc + "명</span>";
        }
        if (kids.length) chips += '<span class="mc kids">▸' + kids.length + "</span>";
        var olock = !canEdit(nn);
        if (olock) chips = '<span class="lockchip">🔒</span>' + chips;
        body += '<div class="row' + (sel ? " sel" : "") + (isHit(nn) ? " hit" : "") + (olock ? " locked" : "")
          + '" style="padding-left:' + (depth * 20) + 'px">'
          + '<div class="tog"' + (kids.length ? ' data-act="toggle" data-id="' + esc(nn.id) + '" style="cursor:pointer"' : "") + ">" + (kids.length ? (col ? "▸" : "▾") : "") + "</div>"
          + '<div class="rowmain" data-act="select" data-id="' + esc(nn.id) + '"><span class="lvb ' + (detail ? "d" : "g") + '">lv' + nn.level + "</span>"
          + '<input class="rowname" data-fkey="name" data-id="' + esc(nn.id) + '" value="' + esc(nn.name) + '" placeholder="' + esc(LABELS[nn.level]) + '명" />'
          + (nn.desc ? '<span class="rowdesc">' + esc(nn.desc) + "</span>" : "") + chips
          + (S.dirty.indexOf(nn.id) >= 0 ? '<span class="dot"></span>' : "") + "</div>"
          + (nn.level < LEVEL_MAX ? '<button class="rowadd" data-act="add" data-pid="' + esc(nn.id) + '" data-lv="' + (nn.level + 1) + '" title="하위 추가">＋</button>' : "")
          + (nn.level >= 5 ? '<button class="rowdel ccopy" data-act="copy" data-id="' + esc(nn.id) + '" title="복사 — 하위 포함, 이름 수정 필요">⧉</button>' : "")
          + '<button class="rowdel" data-act="del" data-id="' + esc(nn.id) + '" title="이 ' + esc(LABELS[nn.level]) + ' 삭제' + (kids.length ? " (하위 " + descCount(nn.id) + "개 포함)" : "") + '">🗑</button>'
          + "</div>";
        if (!col) walk(nn.id, depth + 1);
      });
    })(ROOT, 0);
    if (!body) {
      body = '<div class="emptyhint" style="padding:24px;text-align:center;line-height:1.6">'
        + (scopeOn()
            ? "<b>" + esc(S.eDept || S.eGroup) + "</b> 소속으로 입력된 업무가 없습니다.<br/>상단 <b>편집 범위</b>를 바꿔 보세요."
            : (S.lv3Sel.length
                ? "고른 부문에 업무가 없습니다."
                : "위에서 <b>부문</b>을 고르세요 — <b>전체</b> 버튼으로 전부 볼 수 있습니다.")) + "</div>";
    }
    return '<div class="outwrap"><div class="outcard"><div class="outhead"><span class="h1">업무 계층 전체보기</span><span class="h2">클릭하면 오른쪽에서 상세 입력</span><div class="grow"></div>'
      + '<button class="minibtn" data-act="collapse">' + (anyOpen ? "모두 접기" : "모두 펼치기") + "</button>"
      + '<button class="minibtn p" data-act="add" data-pid="' + ROOT + '" data-lv="3">＋ 새 부문</button></div>'
      + '<div class="list scroll" style="padding:7px">' + body + "</div></div></div>";
  }

  // 검색어와 이름이 겹치는지 (하이라이트용). 빈 검색어는 아무것도 맞히지 않는다.
  function isHit(nn) {
    var q = (S.query || "").trim().toLowerCase();
    return !!q && String(nn.name || "").toLowerCase().indexOf(q) >= 0;
  }
  function hitCount() {
    var q = (S.query || "").trim(); if (!q) return 0;
    return S.nodes.filter(isHit).length;
  }

  function crumbBar() {
    var chips = FIXED.map(function (f) { return '<span class="chip fix">🔒 ' + esc(f) + "</span><span class=\"sep\">›</span>"; }).join("");
    // lv3(부문)은 드롭다운으로 고른다 — 경로 전체를 늘어놓지 않고 여기서 바로 부문 전환.
    // lv4~lv6 위치는 컬럼의 조상 카드 하이라이트(.path)로 표시하므로 여기 칩으로 붙이지 않는다.
    var lv3s = childrenOf(ROOT), cur3 = S.sel[3] || "";
    // 부문은 **컬러 칩 다중 선택**이다. 선택 = 그 색으로 꽉 참 + ✓, 미선택 = 흰 바탕 + 색 점.
    // (미선택도 색을 채우던 시절엔 어느 것이 골라졌는지 구분되지 않았다.)
    var lv3sel = '<div class="lv3chips">' + lv3s.map(function (n, i) {
      var c = lv3Color(i), on = S.lv3Sel.indexOf(n.id) >= 0;
      var style = on ? "background:" + c + ";color:#fff;border-color:" + c
                     : "background:#fff;color:#57534e;border-color:#e0dbd2";
      return '<button class="lv3chip' + (on ? " on" : "") + '" data-act="lv3pick" data-id="' + esc(n.id)
        + '" data-lv3chip="' + esc(n.id) + '" style="' + style + '">'
        + (on ? "✓ " : '<i class="cdot" style="background:' + c + '"></i>')
        + esc(n.name || "(이름 없음)") + "</button>";
    }).join("")
      + '<button class="lv3mini" data-act="lv3all" title="모든 부문 보기">전체</button>'
      + (S.lv3Sel.length ? '<button class="lv3mini" data-act="lv3none" title="선택 해제">지우기</button>' : "")
      + (scopeOn() ? '<span style="font-size:12.5px;color:#b45309;margin-left:4px">'
                     + "🔒 편집 범위가 켜져 있어 <b>전 부문</b>에서 모아 보는 중 (칩 선택은 무시)</span>" : "")
      + "</div>";
    // 부문 추가/삭제 — 칩 줄 옆 버튼. 삭제는 **정확히 하나** 골랐을 때만(여럿이면 무엇을 지울지 모호).
    var lv3btns = '<button class="crumbbtn add" data-act="add" data-pid="' + ROOT + '" data-lv="3" title="새 부문 추가">＋ 부문</button>'
      + (S.lv3Sel.length === 1 ? '<button class="crumbbtn del" data-act="del" data-id="' + esc(S.lv3Sel[0]) + '" title="이 부문 삭제">🗑</button>' : "");
    var q = (S.query || "").trim();
    var search = '<div class="searchbox"><input data-fkey="query" value="' + esc(S.query || "") + '" placeholder="🔎 업무명 검색" />'
      + (q ? '<span class="shits">' + hitCount() + "건</span>" : "") + "</div>";
    return '<div class="crumb">' + chips + lv3sel + lv3btns + '<div class="grow"></div>' + search + "</div>";
  }

  /** 복수 선택 칩. 기존 활용기술 칩(.tchip)과 같은 모양·같은 토글 방식을 쓴다. */
  function chipRow(id, key, opts, sel, label) {
    sel = sel || [];
    var chips = opts.map(function (o) {
      var v = typeof o === "string" ? o : o.v, t = typeof o === "string" ? o : o.t;
      var on = sel.indexOf(v) >= 0;
      return '<button class="tchip' + (on ? " on" : "") + '" data-act="mchip" data-id="' + esc(id)
        + '" data-k="' + esc(key) + '" data-v="' + esc(v) + '">' + esc(t) + "</button>";
    }).join("");
    return '<div><div class="fl">' + label + '</div><div class="techrow">' + chips + "</div></div>";
  }
  /** 적용 선종 칩 — ship_type 도메인(도메인관리)에서 값을 읽는다. 두 앱 공용(SOLO occurBlock·메인앱 패널). */
  function shipTypeChips(id, n) {
    return chipRow(id, "ship_types", (S.domains.ship_type || []), n.ship_types,
                   '적용 선종 <span style="color:#a8a29e;font-weight:600">· 여러 개 선택. 비우면 전 선종</span>');
  }

  /** 기간 단위 단일 선택 칩(택1). 칩 모양은 활용기술과 같되 한 번에 하나만 켜진다. */
  function freqUnitChips(id, sel) {
    var chips = FREQ_UNIT_KEYS.map(function (u) {
      var on = (sel === u);
      return '<button class="tchip' + (on ? " on" : "") + '" data-act="freqchip" data-id="' + esc(id)
        + '" data-v="' + esc(u) + '">' + esc(u) + "</button>";
    }).join("");
    return '<div><div class="fl">기간 단위 <span style="color:#a8a29e;font-weight:600">· 택1</span></div><div class="techrow">' + chips + "</div></div>";
  }

  /** lv6 발생 패턴 블록 — 패턴에 따라 필요한 필드만 보여준다.
   *  세 패턴이 요구하는 값이 서로 달라서, 다 늘어놓으면 작성자가 뭘 채워야 할지 모른다. */
  function occurBlock(n, id) {
    var p = occurOf(n);
    var pat = OCCUR_PATTERNS.map(function (t) {
      return '<button class="tchip' + (p === t ? " on" : "") + '" data-act="occur" data-id="' + esc(id)
        + '" data-v="' + esc(t) + '">' + esc(t) + "</button>";
    }).join("");
    var HINT = {};
    HINT[OCCUR.ROUTINE] = "호선과 상관없이 늘 하는 업무";
    HINT[OCCUR.SHIP_ROUTINE] = "호선 도는 동안 반복하는 업무";
    HINT[OCCUR.SHIP_EVENT] = "특정 시점에만 하는 업무";
    var h = '<div style="margin-top:8px;padding-top:14px;border-top:1px dashed #e7e1d6">'
      + '<div class="fl">언제 하는 업무인가요 <span style="color:#a8a29e;font-weight:600">· '
      + esc(HINT[p] || "") + '</span></div><div class="techrow">' + pat + "</div></div>";

    // 1회 소요시간은 세 패턴 공통 — 부하의 원자 단위
    var whCell = '<div><div class="fl">1회 소요시간 <span style="color:#a8a29e;font-weight:600">· 시간 (30분=0.5)</span></div>'
      + '<input class="fi" style="font-size:14.5px;padding:8px 10px" data-fkey="work_hours" data-id="' + esc(id) + '" value="' + esc(n.work_hours) + '" placeholder="예: 2" /></div>';

    if (p === OCCUR.SHIP_EVENT) {
      h += '<div style="margin-top:10px">' + whCell + "</div>";   // 소요시간만 (시점은 아래 목록)
      // 시점을 여러 개 지정한다. 줄 수가 곧 호선당 횟수 (GT-7, AC-7 → 2줄 = 2회).
      var evs = n.events || [];
      var evStyle = 'display:flex;gap:6px;align-items:center;margin-top:6px';
      var rows = evs.map(function (ev, i) {
        return '<div style="' + evStyle + '">'
          + '<select class="fs" style="flex:1.4;font-size:14px;padding:7px 8px" data-fkey="ev_event" data-id="' + esc(id) + '" data-idx="' + i + '">'
          + '<option value="">기준 시점 —</option>'
          + MILESTONE_EVENTS.map(function (e) { return '<option value="' + esc(e) + '"' + (ev.event === e ? " selected" : "") + ">" + esc(e) + "</option>"; }).join("")
          + "</select>"
          + '<input class="fi" style="flex:1;font-size:14px;padding:7px 8px" data-fkey="ev_offset_start" data-id="' + esc(id) + '" data-idx="' + i + '" value="' + esc(ev.offset_start) + '" placeholder="±일 예:-7" />'
          + '<input class="fi" style="flex:1;font-size:14px;padding:7px 8px" data-fkey="ev_offset_days" data-id="' + esc(id) + '" data-idx="' + i + '" value="' + esc(ev.offset_days) + '" placeholder="며칠 예:1" />'
          + '<button data-act="evdel" data-id="' + esc(id) + '" data-idx="' + i + '" title="삭제" style="flex:none;border:1px solid #e7e1d6;background:#faf8f4;color:#b91c1c;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:15px">✕</button>'
          + "</div>";
      }).join("");
      h += '<div style="margin-top:10px"><div class="fl">발생 시점 <span style="color:#a8a29e;font-weight:600">· 마일스톤 기준 ±일. 여러 번이면 줄 추가 (줄 수 = 호선당 횟수)</span></div>'
        + (rows || '<div class="solohint" style="padding:6px 0">아직 시점이 없습니다. 아래 버튼으로 추가하세요.</div>')
        + '<button data-act="evadd" data-id="' + esc(id) + '" style="margin-top:8px;font-size:14px;padding:7px 12px;border:1px dashed #14b8a6;background:#f0fdfa;color:#0f766e;border-radius:8px;cursor:pointer;font-weight:700">＋ 시점 추가</button></div>';
    } else {
      // 상시·호선루틴 공통 — 기간 단위는 칩(택1) 한 줄, 그 아래 소요시간·횟수(grid2). 나눠야 "주 3회" 표현
      h += '<div style="margin-top:10px">' + freqUnitChips(id, n.freq_unit) + "</div>"
        + '<div class="grid2" style="margin-top:8px">' + whCell
        + '<div><div class="fl">횟수 <span style="color:#a8a29e;font-weight:600">· 단위당</span></div>'
        + '<input class="fi" style="font-size:14.5px;padding:8px 10px" data-fkey="freq_count" data-id="' + esc(id) + '" value="' + esc(n.freq_count) + '" placeholder="예: 3" /></div>'
        + "</div>";
      if (p === OCCUR.SHIP_ROUTINE) {
        h += chipRow(id, "apply_phases", TRIAL_PHASES, n.apply_phases,
                     '반복 구간 <span style="color:#a8a29e;font-weight:600">· 여러 개 선택 가능</span>');
      }
    }

    // 선종 — 호선 패턴(호선루틴·호선이벤트)에서만. 부하 계산이 "호선.선종 ∈ 업무.선종" 으로
    // 조인하는 적용 필터다. 상시루틴은 호선 무관이라 선종이 없다. 값은 ship_type 도메인(도메인관리).
    if (p === OCCUR.SHIP_ROUTINE || p === OCCUR.SHIP_EVENT) {
      h += shipTypeChips(id, n);
    }

    // 부하 수치는 왼쪽 카드 배지로 옮겼다 (패널 스크롤 축소).
    // 여기선 아직 못 채운 경우에만 한 줄로 안내한다.
    var L = loadOf(n);
    if (L.kind === "annual" && !L.hours)
      h += '<div class="solohint" style="padding-top:8px">기간단위·횟수·소요시간을 채우면 왼쪽 카드에 <b>연간 부하</b>가 표시됩니다.</div>';
    else if (L.kind === "per_ship" && !L.hours)
      h += '<div class="solohint" style="padding-top:8px">소요시간과 발생 시점을 채우면 왼쪽 카드에 <b>호선당 부하</b>가 표시됩니다.</div>';
    else if (L.kind === "unresolved")
      h += '<div class="solohint" style="padding-top:8px">구간 길이는 나중에 호선 일정으로 산출합니다. 카드엔 <b>구간부하</b>로 표시됩니다.</div>';
    return h;
  }


  function panel() {
    if (!S.selectedId) {
      return '<div class="panel"><div class="pempty"><div style="font-size:34px">👈</div><div style="font-size:15px;font-weight:700;color:#57534e">카드를 선택하면 여기서 편집합니다</div><div style="font-size:13.5px;color:#a8a29e;line-height:1.6">각 컬럼의 <b>＋</b> 로 새 업무를 추가하고,<br/>내용은 입력 즉시 반영됩니다. 마치면 상단 <b>저장</b>.</div></div></div>';
    }
    var n = byId(S.selectedId); if (!n) return '<div class="panel"></div>';

    var deptChip = (!SOLO && detail)
      ? '<span class="pdept' + (n.dept ? "" : " none") + '">🏢 ' + esc(n.dept || "부서 미지정") + "</span>"

    var head = '<div class="phead ' + (detail ? "d" : "g") + '"><div class="prow"><span class="ptag">지금 편집 중</span>'

      + '<div style="margin-top:8px;display:flex;align-items:flex-start;gap:10px"><div class="pname" style="flex:1;margin:0">' + esc(n.name || "(이름 없음)") + '</div><button class="delbtn" style="flex:none;font-size:13px;padding:6px 10px;white-space:nowrap" data-act="del" data-id="' + esc(id) + '">🗑 삭제 ' + (descCount(id) > 1 ? "(하위 " + (descCount(id) - 1) + "개 포함)" : "") + '</button></div>'
      + '<div class="ppath">' + esc(pathNames(id).join("  ›  ")) + "</div></div>";

    var nameField = '<div><div class="fl">' + esc(LABELS[lv]) + '명</div><input class="fi" data-fkey="name" data-id="' + esc(id) + '" value="' + esc(n.name) + '" placeholder="이름을 입력하세요" /></div>';
    var descField = '<div><div class="fl">설명</div><textarea class="fa" data-fkey="desc" data-id="' + esc(id) + '" placeholder="이 업무가 무엇인지 간단히">' + esc(n.desc) + "</textarea></div>";
    // lv3~5 는 상단에 이름+설명(2열). lv6 은 이름만 상단, 설명은 좌측 컬럼으로 내려 하단 여백을 채운다.
    var fields = detail ? nameField

      fields += '<div class="note">📁 ' + esc(josa(LABELS[lv])) + ' 업무를 묶는 분류입니다.<br/>AI 에이전트·담당자 같은 세부 정보는 <b style="color:#0f766e">lv6 세부업무·lv7 단위작업</b>에서 입력합니다.</div>';
      if (hidden) fields += '<div class="warn">💾 이전에 입력한 세부 정보가 보존되어 있습니다. lv6으로 옮기면 다시 나타납니다.</div>';
    } else {

      var techChips = (S.domains.tech || []).map(function (t) { var on = (n.tech || []).indexOf(t) >= 0; return '<button class="tchip' + (on ? " on" : "") + '" data-act="tech" data-id="' + esc(id) + '" data-t="' + esc(t) + '">' + esc(t) + "</button>"; }).join("");
      // 향후 AI 적용 기술 — 현재 활용기술(tech)과 같은 목록에서 다중 선택
      var futureChips = (S.domains.tech || []).map(function (t) { var on = (n.future_tech || []).indexOf(t) >= 0; return '<button class="tchip' + (on ? " on" : "") + '" data-act="ftech" data-id="' + esc(id) + '" data-t="' + esc(t) + '">' + esc(t) + "</button>"; }).join("");
      // AI 에이전트 적용여부 = **파생**. 현재 = 활용기술 있으면, 향후 = 향후 AI 적용 기술 있으면.
      var aiCur = (n.tech || []).length > 0, aiFut = (n.future_tech || []).length > 0;
      function aiBadge(on) { return '<span class="aicard ' + (on ? "on" : "") + '" style="display:inline-flex;align-items:center;gap:5px;margin:0;padding:2px 8px;font-size:12px;vertical-align:middle"><span class="ait" style="color:' + (on ? "#166534" : "#a8a29e") + '">🤖 ' + (on ? "AI 적용" : "미적용") + "</span></span>"; }
      var automationBlock = '<div><div class="fl">현재 자동화 수준</div><select class="fs" data-fkey="automation_level" data-id="' + esc(id) + '">' + opt("automation_level", n.automation_level) + "</select></div>";
      // 소속은 **입력받지 않는다** — 제출 봉투의 소속(= 그 사람의 과)이 곧 이 업무의 과다.
      // 노드마다 또 물으면 같은 값을 두 번 받는 셈이고, 취합이 여러 과를 모으는 것과도 어긋난다.
      // 읽기 전용으로 보여만 준다(어느 과 업무인지 보이던 정보를 잃지 않게).

      var nonSolo = SOLO ? "" :
             '<div class="grid2">' + deptRO + "</div>"
           // 수행 주기 = 기간 단위 칩(택1) + 횟수. 연간 횟수는 횟수×단위연간수로 파생하므로 별도 입력칸 없음
           + '<div style="margin-top:9px">' + freqUnitChips(id, n.freq_unit) + "</div>"
           + '<div class="grid2" style="margin-top:8px">'
           + '<div><div class="fl">1회 소요시간 <span style="color:#a8a29e;font-weight:600">· 시간 (30분=0.5)</span></div>'

           + '<div><div class="fl">횟수 <span style="color:#a8a29e;font-weight:600">· 단위당</span></div>'
           + '<input class="fi" style="font-size:14.5px;padding:8px 10px" data-fkey="freq_count" data-id="' + esc(id) + '" value="' + esc(n.freq_count) + '" placeholder="예: 3" /></div>'
           + "</div>";
      var occ = SOLO ? occurBlock(n, id)
                     : '<div class="mh">연간 공수 <b>' + (annualHours(n) ? annualHours(n) + " 시간" : "—") + "</b>"
                       + '<span>1회 소요시간 × (횟수 × 단위 연간수)</span></div>';
