        // 도메인 탭까지 가지 않고 여기서 바로 새 기술을 만든다 (v1 "목록에 없는 기술 추가")
        + '<input class="fi" style="font-size:14px;padding:7px 9px;margin-top:7px" data-fkey="newtech" data-id="' + esc(id) + '" value="" placeholder="목록에 없는 기술 추가 — 입력 후 Enter (쉼표로 여러 개)" /></div>';
      var outputsBlock = '<div><div class="fl">산출물</div><input class="fi" style="font-size:14.5px" data-fkey="outputs" data-id="' + esc(id) + '" value="' + esc(n.outputs) + '" placeholder="예: 시운전 결과보고서" /></div>';
      // 연계 시스템 다건 — (연계시스템 select + 추가정보 input) 쌍을 여러 줄. 호선이벤트 events[] 식.
      var linkRows = (n.linked_systems || []).map(function (ls, idx) {
        return '<div class="grid2" style="margin-top:6px">'
          + '<div><select class="fs" data-fkey="ls_system" data-id="' + esc(id) + '" data-idx="' + idx + '">' + opt("linked_system", ls.system) + "</select></div>"
          + '<div style="display:flex;gap:6px;align-items:center"><input class="fi" style="flex:1;font-size:14.5px;padding:8px 10px" data-fkey="ls_detail" data-id="' + esc(id) + '" data-idx="' + idx + '" value="' + esc(ls.detail) + '" placeholder="추가 정보(예: MM모듈)" />'
          + '<button class="cdel" data-act="lsdel" data-id="' + esc(id) + '" data-idx="' + idx + '" title="이 연계 삭제">🗑</button></div>'
          + "</div>";
      }).join("");
      var linkedBlock = '<div><div class="fl">연계 시스템 <span style="color:#a8a29e;font-weight:600">· 시스템+추가정보, 여러 개 가능</span></div>'
        + (linkRows || '<div class="solohint" style="padding:5px 0">아직 연계가 없습니다. 아래 버튼으로 추가하세요.</div>')
        + '<button data-act="lsadd" data-id="' + esc(id) + '" style="margin-top:8px;font-size:14px;padding:7px 12px;border:1px dashed #14b8a6;background:#f0fdfa;color:#0f766e;border-radius:8px;cursor:pointer;font-weight:700">＋ 연계시스템 추가</button></div>';
      var futureTechBlock = '<div><div class="fl">향후 AI 적용 기술 <span style="color:#a8a29e;font-weight:600">· 현재 기술과 같은 목록</span> ' + aiBadge(aiFut) + '</div><div class="techrow">' + futureChips + "</div></div>";
      var specialNoteBlock = chipRow(id, "special_note", (S.domains.special_note || []), n.special_note,
                                     '특이사항 <span style="color:#a8a29e;font-weight:600">· 여러 개 선택</span>');
      // 적용선종 — 메인앱은 여기(호선 패턴일 때만). SOLO 는 occurBlock 안에 이미 있다.
      var shipBlock = (!SOLO && (occurOf(n) === OCCUR.SHIP_ROUTINE || occurOf(n) === OCCUR.SHIP_EVENT)) ? shipTypeChips(id, n) : "";
      // 설명 — lv6 은 좌측 컬럼에서, 하단 여백을 채우도록 키를 늘린다(flex:1)
      var descBlock = '<div class="pcol-grow"><div class="fl">설명</div><textarea class="fa" style="min-height:96px;flex:1" data-fkey="desc" data-id="' + esc(id) + '" placeholder="이 업무가 무엇인지 간단히">' + esc(n.desc) + "</textarea></div>";
      // 2열: 왼쪽 = 설명·발생/부하·자동화수준(+비SOLO 필드), 오른쪽 = 활용기술·산출물·연계(다건)·향후AI·특이사항·선종
      fields += '<div class="pgrid">'
        + '<div class="pcol">' + nonSolo + occ + automationBlock + descBlock + "</div>"
        + '<div class="pcol">' + techBlock + outputsBlock + linkedBlock + futureTechBlock + specialNoteBlock + shipBlock + "</div>"
        + "</div>";
      // 취합 산출물 — 과별 제출값 표가 정본이다. 옛 트리·엑셀 왕복본에는 submissions 가 없어
      // 예전의 한 덩어리 요약 텍스트(submit_detail)로 폴백한다. 둘 다 메인앱 전용·읽기전용.
      if (!SOLO) {
        var subTbl = submissionsTable(n);
        if (subTbl) {
          fields += subTbl;
        } else if (n.submit_detail) {
          fields += '<div style="margin-top:12px"><div class="fl">🧩 취합 상세 <span style="color:#a8a29e;font-weight:600">· 제출 '
            + esc(n.submit_count || "") + '명 (부서별)</span></div>'
            + '<div class="cardbox" style="padding:10px 12px;font-size:13.5px;color:#57534e;line-height:1.7;white-space:pre-wrap">'
            + esc(n.submit_detail) + "</div></div>";
        }
      }
    }

    // 상위 업무 바꾸기 — 드래그로 불가능한 레벨 변경(승격/강등)의 유일한 경로
    var tg = moveTargets(id), kids = descCount(id);
    // .pfoot = flex:none — 이 블록이 눌리면 위 상세 폼과 겹친다(CSS 주석 참조)
    fields += '<div class="pfoot">'
      + '<div class="fl">상위 업무 바꾸기 <span style="color:#a8a29e;font-weight:600">· 레벨도 함께 바뀝니다</span></div>'
      + '<select class="fs" data-fkey="moveto" data-id="' + esc(id) + '">'
      + tg.map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === n.parent_id ? " selected" : "") + ">" + esc(t.label) + "</option>"; }).join("")
      + "</select>"
      + (kids ? '<div style="font-size:13.5px;color:#a8a29e;margin-top:5px">하위 업무 ' + kids + "개도 함께 이동하며 레벨이 다시 매겨집니다.</div>" : "")
      + "</div>";

    // 잠긴 노드는 폼을 통째로 비활성(.panel.locked → pointer-events:none)하고 이유를 배너로 말한다.
    // 입력 위젯마다 disabled 를 다는 대신 CSS 한 겹으로 막는 이유는, 위젯이 늘 때마다 빠뜨리지 않기 위해서다.
    var _lk = !canEdit(n);
    return '<div class="panel' + (_lk ? " locked" : "") + '">' + head
      + '<div class="pbody scroll">' + lockBanner(n) + fields + "</div></div>";
  }

  /** 💬 질의 — 취합·저장된 계층 전체를 컨텍스트로 LLM 에 묻는다(읽기 전용, 트리를 바꾸지 않는다).
   *  스트리밍은 없다 — 이 앱은 "사용자 조작 1건 = 파이썬 왕복 1회" 구조다. */
  function pageChat() {
    var log = S.chatLog || [];
    var SAMPLES = ["세부업무가 가장 많은 부서는?", "AI 를 아직 적용하지 않은 업무를 10개만 알려줘",
                   "여러 명이 함께 하는 업무는 뭐가 있어?", "연간 공수가 큰 업무 순으로 알려줘"];
    var msgs = log.map(function (m) {
      var mine = m.role === "user";
      return '<div class="chatmsg' + (mine ? " me" : "") + (m.err ? " err" : "") + '">'
        + '<div class="who">' + (mine ? "나" : "조수") + "</div>"
        + '<div class="txt">' + esc(m.text || "").replace(/\n/g, "<br/>") + "</div></div>";
    }).join("");
    var empty = '<div class="chatempty">계층 편집에 들어 있는 <b>세부업무(lv6)</b> 와 <b>취합 결과</b>를 근거로 답합니다.<br/>'
      + '담당자 이름은 전송되지 않습니다(소속만).<br/><div style="margin-top:14px">'
      + SAMPLES.map(function (s) { return '<button class="chipbtn" data-act="chatsample" data-q="' + esc(s) + '">' + esc(s) + "</button>"; }).join("") + "</div></div>";
    return '<div class="page scroll"><div class="pw"><div class="h1">💬 질의</div>'
      + '<div class="sub">현재 화면의 계층(저장 전 편집 포함)에 대해 물어보세요. ' + esc(S.chatProvider || "") + "</div>"
      + '<div class="chatbox">' + (msgs || empty) + (S.chatBusy ? '<div class="chatmsg"><div class="who">조수</div><div class="txt" style="color:#a8a29e">생각하는 중…</div></div>' : "") + "</div>"
      + '<div class="chatinput"><textarea class="fa" data-fkey="chatq" rows="2" placeholder="예: 방폭 관련 업무는 몇 개야? (Ctrl+Enter 로 전송)">' + esc(S.chatQ || "") + "</textarea>"
      + '<button class="primary" data-act="chatsend"' + (S.chatBusy ? " disabled" : "") + ">보내기</button></div>"
      + (log.length ? '<div style="margin-top:10px"><button class="secondary" data-act="chatclear">대화 지우기</button></div>' : "")
      + '<div style="font-size:13px;color:#a8a29e;margin-top:12px">답변은 참고용입니다 — 수치는 요약·엑셀에서 확인하세요. 대화는 저장되지 않습니다.</div>'
      + "</div></div>";
  }

  function chatSend(q) {
    q = String(q || "").trim();
    if (!q) return flash("질문을 입력하세요");
    if (S.chatBusy) return;
    // 낙관적 표시 — 왕복이 끝나면 파이썬의 chat_log 가 통째로 덮는다(정본은 파이썬).
    S.chatLog = (S.chatLog || []).concat([{ role: "user", text: q }]);
    S.chatQ = ""; S.chatBusy = true;
    rerender();
    emit({ type: "chat", q: q, nodes: S.nodes, domains: S.domains });
  }

  function pageDomain() {
    // '수행 주기'는 두 앱 모두 기간단위 칩+횟수로 대체했으므로 도메인 목록에서 감춘다 (안 쓰는 도메인).
    var keys = ["dept", "tech", "automation_level", "ship_type", "special_note", "linked_system"];
    if (keys.indexOf(S.domTab) < 0) S.domTab = keys[0];   // 숨긴 탭이 선택돼 있으면 첫 탭으로
    var tabs = keys.map(function (k) { return '<button class="stab' + (S.domTab === k ? " on" : "") + '" data-act="domtab" data-k="' + k + '">' + esc(DL[k]) + ' <span style="opacity:.55">' + (S.domains[k] || []).length + "</span></button>"; }).join("");
    var dk = S.domTab;
    // 도메인 값 → 드릴다운 축. 활용기술만 현재/향후 둘로 갈린다(합산하면 "지금 쓰는 것"과
    // "하려는 것"이 안 갈린다) — 나머지는 축 하나.
    var DOM_AXIS = { dept: "dept", automation_level: "automation", ship_type: "ship_type",
                     special_note: "special_note", linked_system: "linked_system" };
    /** 이 탭에 필요한 축의 **카운트 맵을 1패스로** 만든다.
     *
     *  예전엔 값마다 `sumNodes(axis, v)` 를 불렀다 — 활용기술 탭이면 값 9개 × 2축 = 18회,
     *  매회 전 노드를 훑으며 롤업까지 돌아 렌더 하나가 수백 ms 를 먹었다.
     *  ★ **술어를 새로 쓰지 않는다** — 같은 `sumNodes` 를 축마다 **한 번씩만** 부르고 결과를
     *    값별로 세어 둔다. 그래야 "배지 숫자 = 클릭했을 때 뜨는 목록" 계약이 자동으로 유지된다
     *    (S.fDept/S.fGroup 필터도 sumNodes 안에 있으므로 함께 반영된다). */
    var _useCount = {};
    function countsFor(axis) {
      if (_useCount[axis]) return _useCount[axis];
      var m = Object.create(null);
      // 축별로 그 값에 해당하는 lv6 을 한 번에 모은다. sumNodes 는 (axis, key) 를 받으므로
      // 값마다 부르는 대신, 도메인 값 목록을 돌며 **축당 1회** 전수 순회로 카운트한다.
      (S.domains[DOM_SRC[axis] || axis] || []).forEach(function (v) { m[v] = 0; });
      S.nodes.forEach(function (n) {
        if (!isLoadLevel(n.level)) return;
        if (S.fDept && deptsOf(n).indexOf(S.fDept) < 0) return;        // sumNodes 와 같은 필터
        if (S.fGroup && deptGroupsOf(n).indexOf(S.fGroup) < 0) return;
        AXIS_VALS[axis](n).forEach(function (v) { if (v in m) m[v]++; else m[v] = 1; });
      });
      _useCount[axis] = m;
      return m;
    }
    /** 배지 칩 1개. 숫자는 위 카운트 맵에서 조회만 한다(목록과 같은 술어). */
    function useChip(axis, v, label, cls) {
      var c = countsFor(axis)[v] || 0;
      var on = S.sumPick && S.sumPick.axis === axis && S.sumPick.key === v;
      return '<span class="use ' + (c > 0 ? (cls || "y") : "n") + (on ? " picked" : "") + ' clickable"'
        + ' data-act="sumpick" data-axis="' + axis + '" data-key="' + esc(v) + '"'
        + ' title="lv6 세부업무 기준(lv7 롤업 포함) · 클릭하면 우측에 목록">' + label + " " + c + "</span>";
    }
    // 사용 수 표시는 개인 배포판에선 숨긴다(부서가 늘 0이라 혼란) — 삭제 잠금 계산은 유지.
    function drow(v, i) {
      // ★ 잠금은 domUsage(전 레벨) 기준으로 남긴다 — 배지(lv6)와 **일부러 다르다**.
      //   lv3~lv5 에 숨은 값(레벨 승격 시 보존분)이 안 잡혀 쓰는 중인데 지워지는 사고를 막는다.
      var del = domUsage(dk, v) > 0;
      var badge;
      if (SOLO) badge = "<span></span>";
      else if (dk === "tech") badge = '<span class="usewrap">' + useChip("tech_now", v, "현재", "y") + useChip("tech_future", v, "향후", "f") + "</span>";
      else badge = '<span class="usewrap">' + useChip(DOM_AXIS[dk] || dk, v, "업무", "y") + "</span>";
      // 'AI로 카운트' 체크박스 — 활용기술 탭 전용, **메인앱에서만**.
      // SOLO 에 두지 않는 이유: 개인 배포판의 domains 는 취합에서 버려지므로(parse_json 3번 블록)
      // 20명이 각자 정책을 정하면 전부 유실된다. 사용 수를 숨기는 것과 같은 논리다.
      var aiCell = "";
      if (!SOLO && dk === "tech") {
        var onAi = ((S.domains.tech_no_ai || []).indexOf(v) < 0);
        aiCell = '<label class="aichk' + (onAi ? "" : " off") + '" title="끄면 이 기술만 가진 업무는 AI 적용률에서 빠집니다 (사용 수 집계는 그대로)">'
          + '<input type="checkbox" data-fkey="techai" data-v="' + esc(v) + '"' + (onAi ? " checked" : "") + " />AI로 카운트</label>";
      }
      return '<div class="drow' + (aiCell ? " aicol" : "") + '"><input class="dinput" data-fkey="dom" data-k="' + dk + '" data-i="' + i + '" value="' + esc(v) + '" />' + badge + aiCell + '<button class="delbtn" style="' + (del ? "color:#cabfb0;border-color:#e7e1d6;cursor:not-allowed" : "") + '" data-act="domdel" data-k="' + dk + '" data-i="' + i + '">삭제</button></div>';
    }
    var rows;
    if (dk === "dept") {
      // 부서/과는 과 목록을 **부서별 그룹 소제목**으로 묶어 보여준다(값·index 는 그대로).
      var groups = {}, order = [];
      (S.domains.dept || []).forEach(function (v, i) { var b = deptParent(v); if (!groups[b]) { groups[b] = []; order.push(b); } groups[b].push([v, i]); });
      rows = order.map(function (b) {
        return '<div style="padding:9px 16px 5px;font-size:13px;font-weight:800;color:#0f766e;background:#f7fdfc;border-bottom:1px solid #eef4f2">🏢 ' + esc(b) + "</div>"
          + groups[b].map(function (p) { return drow(p[0], p[1]); }).join("");
      }).join("");
    } else {
      rows = (S.domains[dk] || []).map(drow).join("");
    }
    var aiHead = (!SOLO && dk === "tech");
    var left = '<div class="cardbox"><div class="dhead' + (aiHead ? " aicol" : "") + '"><span>값</span>'
      + (SOLO ? "<span></span>" : "<span>사용 중</span>") + (aiHead ? "<span>AI 적용</span>" : "") + '<span></span></div>' + rows
      + '<div style="padding:13px 16px"><button class="dadd" data-act="domadd" data-k="' + dk + '">＋ 값 추가</button></div></div>'
      + '<div style="font-size:13.5px;color:#a8a29e;margin-top:12px">값을 고친 뒤 <b>칸을 벗어나면</b> 반영됩니다. '
      + (SOLO ? '제출하려면 상단 <b>⬇ 제출 파일 내보내기</b> 를 누르세요.'
              : '파일에 기록하려면 상단 <b>저장</b> 을 누르세요.') + "</div>";
    return '<div class="page scroll"><div class="' + (SOLO ? "pw" : "pw wide") + '"><div class="h1">도메인 관리</div>'
      + '<div class="sub">카드 상세에서 고르는 선택 목록입니다. 값 이름을 바꾸면 그 값을 쓰는 업무도 함께 바뀝니다. 사용 중인 값은 삭제할 수 없습니다.'
      + (SOLO ? "" : ' <b>사용 수를 클릭하면</b> 오른쪽에 그 업무 목록이 뜹니다.') + "</div>"
      + '<div class="subtabs">' + tabs + "</div>"
      // 개인 배포판은 사용 수 자체를 숨기므로 드릴다운도 없다 — 1열로 둔다
      + (SOLO ? left : '<div class="sumgrid"><div>' + left + "</div>" + sumSide() + "</div>")
      + "</div></div>";
  }

  // 엑셀 가져오기 — 파일 선택 → 파이썬이 파싱/미리보기 → 확인 → 반영 (2단계).
  // 확인 없이 반영하면 되돌릴 방법이 [디스크 다시 읽기] 뿐이라 위험하다.
  /** 반영 전 확인용 노드 목록 (엑셀 반영·취합 공용). rows = [{level, path}] — 파이썬이 만든다. */
  function previewList(title, rows, color) {
    if (!rows || !rows.length) return "";
    return '<div style="margin-top:12px"><div style="font-size:14px;font-weight:800;color:' + color + ';margin-bottom:6px">' + title + "</div>"
      + '<div class="cardbox" style="max-height:140px;overflow:auto">'
      + rows.map(function (r) { return '<div style="padding:6px 12px;border-bottom:1px solid #f7f4ee;font-size:14px"><span class="lvb g">lv' + esc(r.level) + "</span> " + esc(r.path) + "</div>"; }).join("")
      + "</div></div>";
  }

  function importPane() {
    var errs = S.importErrors || [];
    if (errs.length) {
      return '<div class="cardbox" style="padding:22px">'
        + '<div class="warn" style="margin-bottom:12px">⚠ 엑셀에 문제가 있습니다. 고친 뒤 다시 올려주세요.</div>'
        + '<div style="max-height:220px;overflow:auto;font-size:14px;color:#78716c;line-height:1.9">'
        + errs.map(function (e) { return "· " + esc(e); }).join("<br/>") + "</div>"
        + '<div style="margin-top:16px"><button class="secondary" data-act="impcancel">다른 파일 올리기</button></div></div>';
    }

    var p = S.importPreview;
    if (!p) {
      return '<div class="cardbox" style="padding:22px">'
        + (identReady() ? "" : '<div class="warn" style="margin-bottom:14px">⚠ 먼저 상단에 <b>저장자</b>를 입력하세요. 입력 전에는 일괄 반영이 되지 않습니다.</div>')
        + '<label class="drop" for="xlsxup"><div style="font-size:26px">⬆</div><div style="font-size:15px;font-weight:700;color:#57534e;margin-top:6px">엑셀(.xlsx) 또는 개인 제출 파일(.json)을 올리세요</div><div style="font-size:13.5px;color:#a8a29e;margin-top:3px">내보내기 탭에서 받은 엑셀, 또는 개인 배포판이 내보낸 JSON</div></label>'
        + '<input id="xlsxup" type="file" accept=".xlsx,.json" style="display:none" data-fkey="xlsxfile" />'
        + '<div style="margin-top:18px;font-size:14px;font-weight:800;color:#57534e">엑셀 작성 규칙</div><ul style="margin:8px 0 0;padding-left:18px;font-size:14px;color:#78716c;line-height:1.9">'
        + "<li>lv3~lv6 칸을 <b>왼쪽부터 연속으로</b> 채웁니다. (lv4 를 비우고 lv5 만 채우면 오류)</li>"
        + "<li>상위 업무는 자기 행이 반드시 있어야 합니다.</li>"
        + '<li><code style="background:#f0ede6;padding:1px 5px;border-radius:4px">id</code> 가 비어 있으면 새 업무로 등록됩니다. 기존 업무는 id 를 지우지 마세요.</li>'
        + "<li>AI·기술·부서 같은 세부 정보는 <b>lv6 세부업무·lv7 단위작업</b> 행에 채웁니다(부하·집계는 lv6 기준, lv7 은 롤업).</li>"
        + "<li>엑셀에서 행을 지워도 <b>기본은 삭제되지 않습니다</b> (반영 전 확인 화면에서 선택).</li>"
        + "<li>담당자가 마스킹된 값(<b>홍*동</b>)이면 원본 이름을 덮어쓰지 않습니다.</li></ul></div>";
    }

    var list = previewList;      // 엑셀 반영·취합이 같은 모양을 쓴다 (previewList 로 승격)
    var cells = [["추가", p.added, "#166534", "#dcfce7"], ["변경", p.changed, "#92400e", "#fef3c7"], ["삭제", p.removed, "#b91c1c", "#fee2e2"]]
      .map(function (d) { return '<div class="diff" style="background:' + d[3] + '"><div class="dv" style="color:' + d[2] + '">' + esc(d[1]) + '</div><div class="dl" style="color:' + d[2] + '">' + d[0] + "</div></div>"; }).join("");

    var unknown = p.unknown || {}, ukeys = Object.keys(unknown);
    var unknownBox = "";
    if (ukeys.length) {
      unknownBox = '<div class="warn" style="margin-top:14px">도메인 목록에 없는 값이 있습니다 — '
        + ukeys.map(function (k) { return esc((p.labels || {})[k] || k) + ": " + esc(unknown[k].join(", ")); }).join(" / ") + "</div>"
        + '<label style="display:flex;align-items:center;gap:9px;margin-top:10px;cursor:pointer"><input type="checkbox" data-fkey="adddomains"' + (S.addDomains ? " checked" : "") + ' style="width:16px;height:16px;accent-color:#0f766e" /><span style="font-size:14.5px;color:#44403c">이 값들을 도메인 목록에 추가</span></label>';
    }
    var delBox = '<label style="display:flex;align-items:center;gap:9px;margin-top:14px;cursor:' + (p.removed ? "pointer" : "not-allowed") + ';opacity:' + (p.removed ? "1" : ".5") + '">'
      + '<input type="checkbox" data-fkey="delmissing"' + (S.delMissing ? " checked" : "") + (p.removed ? "" : " disabled")
      + ' style="width:16px;height:16px;accent-color:#b91c1c" /><span style="font-size:14.5px;color:#44403c">엑셀에 없는 업무 '
      + esc(p.removed) + "개를 삭제합니다</span></label>"
      + '<div style="font-size:13.5px;color:#a8a29e;margin-top:4px;padding-left:25px">기본은 삭제하지 않습니다. 엑셀에서 행을 지운 것이 실수일 수 있습니다.</div>';

    var nothing = !p.added && !p.changed && !p.removed;
    return '<div class="cardbox" style="padding:22px">'
      + '<div style="font-size:15px;font-weight:800;color:#0f766e;margin-bottom:4px">반영 전 확인</div>'
      + (p.filename ? '<div style="font-size:13px;color:#78716c;margin-bottom:12px">📄 <b>' + esc(p.filename) + "</b></div>" : '<div style="margin-bottom:8px"></div>')
      + (nothing ? '<div style="font-size:14.5px;color:#78716c">현재 데이터와 차이가 없습니다.</div>' : '<div class="diffgrid">' + cells + "</div>")
      + list("추가될 업무 " + p.added + "개", p.added_list, "#166534")
      + list("변경될 업무 " + p.changed + "개", p.changed_list, "#92400e")
      + list("삭제될 업무 " + p.removed + "개", p.removed_list, "#b91c1c")
      + delBox + unknownBox
      + '<div style="display:flex;gap:8px;margin-top:20px"><button class="secondary" data-act="impcancel">취소</button>'
      + '<button class="primary" data-act="impapply">이 내용으로 반영</button></div>'
      + '<div style="font-size:13.5px;color:#a8a29e;margin-top:10px">반영 후 상단 [저장] 을 눌러야 파일에 기록됩니다.</div></div>';
  }

  /** 취합 폴더 구조 안내. **소속을 정하는 것이 폴더**라 화면에서 한 번은 보여줘야 한다 —
   *  구조를 모르고 파일을 한 폴더에 평평하게 쌓으면 전원이 파일 안의 소속(또는 '미상')으로 잡히는데,
   *  그때 왜 그런지 짐작할 방법이 화면에 없다. */
  function collectFolderGuide() {
    return '<div class="cardbox" style="margin-top:10px;padding:12px 14px;background:#f6fdfb;border-color:#cceae4">'
      + '<div style="font-size:13.5px;font-weight:800;color:#0f766e;margin-bottom:7px">'
      + '📁 소속은 <u>폴더 구조</u>로 정해집니다 — 첫 하위폴더 = <b>부서</b>, 두 번째 = <b>과</b></div>'
      + '<div style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#57534e;'
      + 'line-height:1.7;white-space:pre;overflow-x:auto">' + esc("스캔 폴더\n ├─ 시운전1부            ← 첫 하위폴더 = 부서\n │   ├─ 기장운전1과      ← 두 번째 = 과 (노드에 저장되는 값)\n │   │    └─ 프로세스_홍길동_20260819.json\n │   └─ 선장운전1과\n │        └─ 프로세스_김철수_20260819.json\n └─ 시운전2부\n     └─ 기장운전2과\n          └─ 프로세스_이영희_20260819.json") + "</div>"
      + '<div style="font-size:12.5px;color:#78716c;line-height:1.75;margin-top:9px">'
      + '· 과 폴더 없이 <b>부서 폴더 바로 아래</b>에 두면 부서 단위로 잡힙니다.<br/>'
      + '· 폴더 없이 <b>맨 위에</b> 두면 파일 안의 소속 → 파일명 순으로 읽습니다 '
      + '<span style="color:#a8a29e">(그 값이 틀리면 파일을 다시 받아야 고쳐집니다 — 폴더로 두면 옮기기만 하면 됩니다)</span>.<br/>'
      + '· 폴더명이 부서·과 목록에 없으면 <b>그대로 저장</b>하고, 반영 시 도메인에 추가할지 물어봅니다.'
      + "</div></div>";
  }

  /** 제출 취합 — 여러 개인 제출 JSON 을 폴더 스캔/다중 업로드로 모아 경로 기준 병합 + 제출 인원수 집계.
   *  파싱·집계는 파이썬(collect_jsons)이 하고 여기선 결과(collect_preview)만 그린다. 메인앱 전용. */
  function collectPane() {
    var errs = S.collectErrors || [];
    if (errs.length) {
      return '<div class="cardbox" style="padding:22px">'
        + '<div class="warn" style="margin-bottom:12px">⚠ 취합할 수 없습니다.</div>'
        + '<div style="max-height:220px;overflow:auto;font-size:14px;color:#78716c;line-height:1.9">'
        + errs.map(function (e) { return "· " + esc(e); }).join("<br/>") + "</div>"
        + '<div style="margin-top:16px"><button class="secondary" data-act="collectcancel">다시 시도</button></div></div>';
    }
    var p = S.collectPreview;
    if (!p) {
      return '<div class="cardbox" style="padding:22px">'
        + '<div style="font-size:15px;font-weight:800;color:#0f766e;margin-bottom:4px">여러 제출을 한 번에 취합</div>'
        + '<div style="font-size:14px;color:#78716c;line-height:1.6;margin-bottom:16px">개인 배포판이 내보낸 <b>프로세스_이름_부서_날짜.json</b> 들을 모아, 같은 업무는 한 노드로 합치고 <b>제출 인원수</b>를 셉니다. <b>소속(과)은 아래 폴더 구조에서 읽습니다.</b> 과마다 다른 소요시간·주기·자동화는 업무별로 따로 보존돼 상세 패널·📊 요약 탭에서 과별로 볼 수 있습니다. 업무 데이터에 이름은 저장되지 않습니다.</div>'
        + (identReady() ? "" : '<div class="warn" style="margin-bottom:14px">⚠ 먼저 상단에 <b>저장자</b>를 입력하세요. 입력 전에는 취합이 되지 않습니다.</div>')
        + '<div class="fl">폴더 경로 스캔 <span style="color:#a8a29e;font-weight:600">· 관리자 PC 기준 경로 · 하위 폴더 포함 · 기본값이 채워져 있으면 [스캔] 만 누르면 됩니다</span></div>'
        + '<div style="display:flex;gap:8px;margin-top:4px"><input class="fi" style="flex:1;font-size:14.5px" data-fkey="collectfolder" value="' + esc(S.collectFolder || "") + '" placeholder="예: C:\\제출취합\\2026-07 (그 아래 부서\\과 폴더까지 전부 스캔)" />'
        + '<button class="primary" style="flex:none;padding:9px 18px" data-act="collectscan">스캔</button></div>'
        + collectFolderGuide()
        + '<div style="text-align:center;color:#a8a29e;font-size:13px;margin:14px 0 10px">— 또는 —</div>'
        + '<label class="drop" for="collectup" style="padding:20px"><div style="font-size:22px">⬆</div><div style="font-size:14.5px;font-weight:700;color:#57534e;margin-top:5px">제출 .json 여러 개 선택 (다중 업로드)</div><div style="font-size:12.5px;color:#a8a29e;margin-top:4px">브라우저가 폴더 경로를 주지 않아 <b>파일 안의 소속</b>으로 잡힙니다 — 되도록 위의 폴더 스캔을 쓰세요</div></label>'
        + '<input id="collectup" type="file" accept=".json" multiple style="display:none" data-fkey="collectfiles" />'
        + '</div>';
    }
    // ── 미리보기 (파일별 상태표 + 병합 요약 + 제출 N명 상위) ──
    var files = p.files || [];
    var okFiles = files.filter(function (f) { return !f.errors; });
    var rowsHtml = files.map(function (f) {
      var bad = !!f.errors;
      // 제외 = lv6 에 닿지 않아 취합에서 뺀 노드 수(골격만 만든 제출). 조용히 버리지 않고 보여준다.
      var sk = Number(f.skipped || 0);
      return '<div style="display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;padding:7px 12px;border-bottom:1px solid #f7f4ee;font-size:13.5px;align-items:center'
        + (bad ? ';background:#fef2f2' : '') + '">'
        + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px" title="' + esc(f.filename) + '">' + esc(f.filename) + "</span>"
        + '<span style="color:' + (f.warn ? "#b45309" : "#57534e") + '"' + (f.warn ? ' title="' + esc(f.warn) + '"' : "")
        + ">" + (f.warn ? "⚠ " : "") + esc(f.dept || "—") + "</span>"
        + '<span style="color:#a8a29e">노드 ' + esc(f.nodes) + "</span>"
        + '<span style="color:' + (sk ? "#b45309" : "#d6d3d1") + '" title="세부업무(lv6)에 닿지 않아 제외한 노드">제외 ' + sk + "</span>"
        + (bad ? '<span style="color:#b91c1c">' + esc(f.errors) + "</span>" : '<span style="color:#166534">신규 ' + esc(f.new) + "</span>")
        + "</div>";
    }).join("");
    var topHtml = (p.top_submits || []).map(function (t) {
      return '<div style="display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #f7f4ee;font-size:14px"><span>' + esc(t.path) + '</span><b style="color:#9d174b">👥 ' + esc(t.count) + "명</b></div>";
    }).join("");
    var nRemoved = Number(p.removed || 0);
    var cells = [["추가", p.added, "#166534", "#dcfce7"], ["변경", p.changed, "#92400e", "#fef3c7"],
                 ["빈 가지 삭제", nRemoved, "#b91c1c", "#fee2e2"]]
      .map(function (d) { return '<div class="diff" style="background:' + d[3] + '"><div class="dv" style="color:' + d[2] + '">' + esc(d[1]) + '</div><div class="dl" style="color:' + d[2] + '">' + d[0] + "</div></div>"; }).join("");
    // 빈 가지(lv6 미도달) 삭제 — 취합이 삭제까지 하는 유일한 경로라 옵트인으로 둔다(기본 켜짐).
    var pruneBox = '<label style="display:flex;align-items:center;gap:9px;margin-top:14px;cursor:' + (nRemoved ? "pointer" : "not-allowed") + ';opacity:' + (nRemoved ? "1" : ".5") + '">'
      + '<input type="checkbox" data-fkey="pruneempty"' + (S.pruneEmpty ? " checked" : "") + (nRemoved ? "" : " disabled")
      + ' style="width:16px;height:16px;accent-color:#b91c1c" /><span style="font-size:14.5px;color:#44403c">세부업무(lv6)가 없는 빈 가지 '
      + nRemoved + "개를 삭제합니다</span></label>"
      + '<div style="font-size:13.5px;color:#a8a29e;margin-top:4px;padding-left:25px">아무도 채우지 않은 부문·대분류·중분류를 지웁니다. 저장 전이면 <b>[↻ 다시 읽기]</b>, 저장 후면 <b>이력·복원</b>에서 되돌릴 수 있습니다.</div>';
    var errCnt = files.length - okFiles.length;
    var scanned = (typeof p.scanned === "number") ? p.scanned : files.length;   // 발견(읽은) JSON 수 — 하위 폴더 포함
    var warns = p.warns || [];
    var warnHtml = warns.length ? '<div class="warn" style="margin:12px 0;font-size:13px">⚠ ' + warns.length + '개 파일 읽기 경고<br/>'
      + warns.map(function (w) { return "· " + esc(w); }).join("<br/>") + "</div>" : "";
    // 제출자 총원 = (부서, 이름) distinct. 트리에 이름을 저장하지 않으므로 스캔 시점에만 알 수 있다.
    var subT = p.submitters_total, subD = p.submitters_by_dept || {};
    var subKeys = Object.keys(subD).sort(function (a, b) { return subD[b] - subD[a]; });
    var subHtml = (typeof subT === "number")
      ? '<div style="font-size:14px;color:#57534e;margin-bottom:10px">👤 제출자 <b style="color:#0f766e">' + subT + '명</b> · 소속 ' + subKeys.length + '곳'
        + (subKeys.length ? ' <span style="color:#a8a29e;font-size:13px">(' + subKeys.map(function (k) { return esc(k) + " " + subD[k]; }).join(" · ") + ")</span>" : "") + "</div>"
      : "";
    return '<div class="cardbox" style="padding:22px">'
      + '<div style="font-size:15px;font-weight:800;color:#0f766e;margin-bottom:10px">반영 전 확인 — 발견한 JSON ' + scanned + '개 · 성공 ' + okFiles.length + '개' + (errCnt > 0 ? ' · 오류 ' + errCnt + '개' : "") + '</div>'
      + subHtml
      + '<div style="font-size:14px;font-weight:800;color:#57534e;margin-bottom:6px">파일별 상태 <span style="font-weight:600;color:#a8a29e">· 하위 폴더는 상대경로로 표시 · 세부업무(lv6)에 닿지 않는 가지는 제외됩니다</span></div>'
      + '<div class="cardbox" style="max-height:200px;overflow:auto;margin-bottom:14px">' + (rowsHtml || '<div style="padding:10px;color:#a8a29e">파일 없음</div>') + "</div>"
      + warnHtml
      // 소속 재설정 — 취합은 이번 스캔의 제출자 소속으로 depts 를 **교체**한다(누적 아님).
      // 제출본 소속을 고쳐 다시 취합하면 여기 뜬다. 조용히 바꾸면 "왜 과가 바뀌었지"가 된다.
      + (Number(p.dept_reset || 0)
          ? '<div class="warn" style="margin:12px 0;border-radius:10px;font-size:13.5px">🏢 <b>소속 재설정 '
            + Number(p.dept_reset) + '건</b> — 이번 스캔의 제출자 소속으로 다시 씁니다(옛 소속은 사라집니다).'
            + (Number(p.submission_reset || 0) ? ' 과별 제출값도 <b>' + Number(p.submission_reset) + '건</b> 다시 씁니다.' : "")
            + "</div>"
          : "")
      // 폴더 부서 ≠ 과의 소속 부서 — 파일을 잘못 놓았을 수 있다. 제외하지 않고 알리기만 한다
      // (과 기준으로 집계하므로 결과는 정상이지만, 폴더가 틀렸다면 다음 회차에도 계속 틀린다).
      + ((p.folder_mismatch || []).length
          ? '<div class="warn" style="margin:12px 0;border-radius:10px;font-size:13px">📁 <b>폴더 부서가 맞지 않는 파일 '
            + p.folder_mismatch.length + '개</b> — <b>과 기준</b>으로 집계했습니다. 폴더 위치를 확인하세요.<br/>'
            + p.folder_mismatch.map(function (m) {
                return '· <span style="font-family:ui-monospace,Consolas,monospace;font-size:12px">' + esc(m.filename) + "</span> — " + esc(m.warn);
              }).join("<br/>") + "</div>"
          : "")
      + '<div class="diffgrid">' + cells + "</div>"
      + previewList("삭제될 빈 가지 " + nRemoved + "개", p.removed_list, "#b91c1c")
      + pruneBox
      + (topHtml ? '<div style="font-size:14px;font-weight:800;color:#9d174b;margin:14px 0 6px">👥 여러 명이 하는 업무 (제출 인원 순)</div><div class="cardbox" style="max-height:200px;overflow:auto">' + topHtml + "</div>" : '<div style="font-size:13.5px;color:#a8a29e;margin-top:12px">2명 이상이 겹쳐 제출한 업무가 없습니다.</div>')
      + '<div style="display:flex;gap:8px;margin-top:20px"><button class="secondary" data-act="collectcancel">취소</button>'

      + step(2, "업무 계층을 만듭니다", '<b>계층 편집</b> 탭에서 <b>부문(lv3) › 대분류(lv4) › 중분류(lv5) › 세부업무(lv6) › 단위작업(lv7)</b> 순으로 각 컬럼의 <b>＋</b> 를 눌러 추가합니다. 카드를 드래그해 순서를 바꾸거나 상위를 바꿀 수 있습니다.<br/>업무가 많으면 <b>내보내기/불러오기</b> 탭의 <b>📋 엑셀에서 계층 붙여넣기</b>로 부문~단위작업(최대 5열)을 한 번에 만드세요.')
      + step(3, "세부업무(lv6)에 내용을 채웁니다", '세부업무 카드를 클릭하면 오른쪽에서 편집합니다. <b>AI 에이전트 적용 여부</b>, <b>자동화 수준</b>, <b>1회 소요시간</b>, 그리고 <b>발생 패턴</b>을 고릅니다.' + patTbl

      + step(4, "제출 파일을 내보냅니다", '<b>내보내기/불러오기</b> 탭에서 <b>⬇ 제출 파일 내보내기(.json)</b> 를 눌러 파일을 받고 관리자에게 전달합니다. 파일명은 <b>프로세스_이름_소속_날짜.json</b> (예: <code style="background:#f0ede6;padding:1px 5px;border-radius:4px">프로세스_홍길동_시운전1부_20260720.json</code>) — 관리자가 여러 제출을 취합할 때 사람을 구분합니다. 업무 데이터에는 소속만 들어갑니다.')
      + step(5, "이어서 작성 / PC 변경", '내보낸 <b>.json</b> 을 <b>내보내기/불러오기</b> 탭에서 다시 불러오면 그 시점부터 이어서 씁니다. PC 를 바꾸거나 브라우저를 초기화했을 때 사용하세요.')
      + '<div class="solohint" style="margin-top:16px">궁금한 점은 관리자에게 문의하세요. 입력값은 부하 분석(건조 계획 × 업무 → 일 단위 부하, AI 도입 효과)에 쓰입니다.</div>'
      + "</div></div>";
  }

    // 집계·요약은 **📊 요약 탭**으로 옮겼다 — 두 곳에 두면 한쪽만 고쳐져 드리프트한다.

  // ── 📊 요약 — lv6 세부업무 기준 현황 (메인앱 전용) ─────────────────
  // 좌: KPI + 과별 비교 그래프 / 우: 목록. 좌측을 클릭하면 우측이 그 부분집합으로 좁혀진다.

  /** 과를 부서별로 묶은 순서 — 세 그래프가 **같은 순서**를 써야 상하로 비교가 된다. */
  function deptRows(st) {
    var groups = {}, order = [];
    Object.keys(st.byDept).forEach(function (g) {
      var b = g === "(미지정)" ? "(미지정)" : deptParent(g);
      if (!groups[b]) { groups[b] = []; order.push(b); }
      groups[b].push(g);
    });
    // 부서는 업무 수 많은 순, 과는 부서 안에서 많은 순
    order.sort(function (a, b) { return sumOf(groups[b], st.byDept) - sumOf(groups[a], st.byDept); });
    order.forEach(function (b) { groups[b].sort(function (x, y) { return st.byDept[y] - st.byDept[x]; }); });
    return { order: order, groups: groups };
  }
  function sumOf(keys, map) { var s = 0; keys.forEach(function (k) { s += map[k] || 0; }); return s; }

  /** 과별 가로막대 — 막대 하나가 **그 과의 전체 세부업무 수**이고 안쪽이 두 구간이다.
   *
   *  ★ scale 은 과별 업무 수의 **공통 최댓값**이다. 과마다 자기 최댓값으로 정규화하면
   *    막대 길이가 서로 비교 불가능해진다.
   *  ★ 클릭 대상이 셋이다 — 과 이름=전체 / AI 구간=적용 / 나머지 구간=미적용.
   *    각각 다른 축을 emit 해서 우측 목록이 달라진다.
   */
  function deptChart(rows, st, scale) {
    var fut = S.aiTab === "future";
    var aiMap = fut ? st.byDeptAiFuture : st.byDeptAiNow;
    var aiColor = fut ? "#7c3aed" : "#0f766e";               // 색 의미 고정 (현재 teal / 향후 보라)
    var axAi = fut ? "dept_ai_future" : "dept_ai_now";
    var axNone = fut ? "dept_ai_none_future" : "dept_ai_none_now";
    function seg(g, v, ax, cls, style, tip) {
      if (!v) return "";
      // 0 이 아니면 최소 2% 는 보이게 (costplan 과 같은 규칙)
      var w = scale ? Math.max(2, Math.min(100, v / scale * 100)) : 0;
      return '<i class="' + cls + '" style="width:' + w.toFixed(1) + '%' + (style || "") + '"'
        + ' data-act="sumpick" data-axis="' + ax + '" data-key="' + esc(g) + '" title="' + esc(tip) + '"></i>';
    }
    var body = rows.order.map(function (b) {
      return '<div class="cgrp">🏢 ' + esc(b) + "</div>"
        + rows.groups[b].map(function (g) {
            var tot = st.byDept[g] || 0, ai = aiMap[g] || 0, off = Math.max(0, tot - ai);
            var on = S.sumPick && S.sumPick.key === g
                  && (S.sumPick.axis === "dept" || S.sumPick.axis === axAi || S.sumPick.axis === axNone);
            return '<div class="brow' + (on ? " picked" : "") + '">'
              + '<div class="bl" title="' + esc(g) + ' — 전체 보기" data-act="sumpick" data-axis="dept" data-key="' + esc(g) + '">' + esc(g) + "</div>"
              + '<div class="btrack">'
              + seg(g, ai, axAi, "seg-ai", ";background:" + aiColor, g + " · AI 적용 " + ai + "건")
              + seg(g, off, axNone, "seg-off", "", g + " · 미적용 " + off + "건")
              + "</div>"
              + '<div class="bv">' + ai + '<span class="bvsub"> / ' + tot + "</span></div></div>";
          }).join("");
    }).join("");
    return '<div class="chart"><div class="ch">과별 세부업무 · AI 적용'
      + '<span class="ctab"><button class="' + (fut ? "" : "on") + '" data-act="aitab" data-k="now">현재</button>'
      + '<button class="' + (fut ? "on" : "") + '" data-act="aitab" data-k="future">향후</button></span>'
      + '<span class="clegend"><span><i style="background:' + aiColor + '"></i>AI 적용</span>'
      + '<span><i style="background:#e7e1d6"></i>미적용</span></span></div>'
      + '<div class="cbody">' + (body || '<div style="color:#a8a29e;font-size:13.5px;padding:8px 0">데이터가 없습니다.</div>') + "</div>"
      + '<div class="cnotefoot">막대 = 그 과의 전체 업무 수 · 수행 과 기준이라 합계 ≠ lv6 수 ·'
      + ' <b>과 이름</b>/<b>색 구간</b>을 누르면 우측 목록이 달라집니다</div></div>';
  }

  /** 요약 탭 부서/과 필터바. 막대(deptChart)·KPI 는 **항상 전체**를 보여주고 이 필터는
   *  우측 목록만 좁힌다 — S.sumPick 과 정확히 같은 관계다. stats() 를 건드리지 않는 이유이기도
   *  하다(schema.stats 와 트윈이라 한쪽만 고치면 화면과 엑셀이 갈린다). */
  /** 부서·과 select 두 개 (요약 보기 필터 / 계층 편집 범위 공용).
   *  데이터에만 있는 소속(폴더에서 온 미등록 과 등)도 고를 수 있어야 한다 — 유실 금지 원칙. */
  function deptSelects(curG, curD, gKey, dKey) {
    var groups = Object.keys(DEPT_TREE), extra = [];
    S.nodes.forEach(function (n) {
      if (!isLoadLevel(n.level)) return;
      deptGroupsOf(n).forEach(function (g) {
        if (g !== "(미지정)" && groups.indexOf(g) < 0 && extra.indexOf(g) < 0) extra.push(g);
      });
    });
    var gOpts = ['<option value="">전체 부서</option>'].concat(
      groups.concat(extra).map(function (g) {
        return '<option value="' + esc(g) + '"' + (curG === g ? " selected" : "") + ">" + esc(g) + "</option>";
      })).join("");
    var gwa = [];
    S.nodes.forEach(function (n) {
      if (!isLoadLevel(n.level)) return;
      deptsOf(n).forEach(function (dd) {
        if (dd === "(미지정)" || gwa.indexOf(dd) >= 0) return;
        if (curG && deptParent(dd) !== curG) return;
        gwa.push(dd);
      });
    });
    gwa.sort();
    var dOpts = ['<option value="">전체 과</option>'].concat(gwa.map(function (dd) {
      return '<option value="' + esc(dd) + '"' + (curD === dd ? " selected" : "") + ">" + esc(dd) + "</option>";
    })).join("");
    return '<select data-fkey="' + gKey + '">' + gOpts + '</select><select data-fkey="' + dKey + '">' + dOpts + "</select>";
  }

  /** 계층 편집 **편집 범위** 바. 범위를 고르면 그 밖의 업무는 보이되 잠긴다(canEdit).
   *  숨기지 않는 이유: 상위 분류(lv3~lv5)는 소속이 없어 숨기면 내 업무가 어디 매달렸는지를 잃고,
   *  다른 과의 중복 제출도 안 보이게 된다. */
  function editScopeBar() {
    if (SOLO) return "";                       // 개인 배포판은 소속이 하나뿐이라 의미가 없다
    var on = scopeOn();
    return '<div class="fbar scopebar">'
      + "<b>편집 범위</b>" + deptSelects(S.eGroup, S.eDept, "egroup", "edept")
      + (on ? '<button class="fclr" data-act="eclear">✕ 전체 편집</button>' : "")
      + '<span style="color:' + (on ? "#b45309" : "#a8a29e") + '">'
      + (on
          ? "🔒 <b>" + esc(S.eDept || S.eGroup) + "</b> 업무만 보이고 수정됩니다 · 다른 소속 업무는 "
              + "<b>숨겨집니다</b>(저장하면 그대로 보존)"
              + (S.eDept ? " · 새 업무는 " + esc(S.eDept) + " 소속으로 만들어집니다"
                         : " · <b>과</b>까지 골라야 새 업무를 추가할 수 있습니다")
          : "부서·과를 고르면 그 소속 업무만 보이고 수정됩니다 (남의 업무를 실수로 고치는 것을 막습니다)")
      + "</span></div>";
  }

  function deptFilterBar() {
    var on = !!(S.fGroup || S.fDept);
    return '<div class="fbar"><b>부서/과로 보기</b>'
      + deptSelects(S.fGroup, S.fDept, "fgroup", "fdept")
      + (on ? '<button class="fclr" data-act="fclear">✕ 필터 해제</button>' : "")
      + '<span style="color:#a8a29e">' + (on
          ? "선택한 소속이 제출한 업무만 · 부하·자동화는 그 과의 제출값으로 표시합니다"
          : "선택하면 오른쪽 목록이 그 소속의 업무로 좁혀집니다") + "</span></div>";
  }

  function pageSummary() {
    var st = stats();
    // KPI — 클릭하면 우측 목록이 그 부분집합이 된다
    var kpis = [["세부업무(lv6)", st.detail, "모든 지표의 분모", "all"],
                ["AI 적용 — 현재", st.ai, st.rate + "%", "ai_now"],
                ["AI 적용 — 향후", st.aiFuture, st.rateFuture + "%", "ai_future"],
                ["연간 공수", st.hours, "시간 (상시루틴 기준)", "hours"],
                // 부하 미입력 = 사람이 채울 것. 호선루틴 보류는 구간길이 조인으로 풀릴 것이라 따로 적는다.
                ["부하 미입력", st.missingTotal,
                 "연간공수 산출 불가" + (st.unresolvedTotal ? " · 호선루틴 " + st.unresolvedTotal + "건 보류" : ""),
                 "missing"]]
      .map(function (m) {
        var on = S.sumPick && S.sumPick.axis === m[3];
        return '<div class="metric clickable' + (on ? " picked" : "") + '" data-act="sumpick" data-axis="' + m[3] + '" data-key="">'
          + '<div class="l">' + m[0] + '</div><div class="v">' + m[1] + '</div><div class="h">' + m[2] + "</div></div>";
      }).join("");
    var rows = deptRows(st);
    // 공통 스케일 = 과별 업무 수의 최댓값. 과마다 자기 최댓값으로 재면 막대 비교가 무의미해진다.
    var scale = 0;
    Object.keys(st.byDept).forEach(function (g) { scale = Math.max(scale, st.byDept[g]); });
    var charts = deptChart(rows, st, scale);
    // ★ KPI 는 **팀 단위 업무 수**, 과별 그래프는 **수행 주체 기준**이라 단위가 다르다.
    //   한 업무를 3개 과가 하면 KPI 는 1, 과별 합계는 3 — 서로 검산하면 안 된다.
    //   이 문구가 없으면 "숫자가 안 맞는다"는 문의가 반드시 나온다.
    var UNIT_NOTE = '<div class="warn" style="margin-top:14px;border-radius:10px;font-size:13.5px">'
      + '※ <b>과별 집계의 합은 위 KPI 와 다릅니다.</b> 한 업무를 여러 과가 수행하면 각 과에 1회씩 잡히기 때문입니다 '
      + '(KPI 는 팀 단위 업무 수).</div>';
    return '<div class="page scroll"><div class="pw wide"><div class="h1">📊 요약</div>'
      + '<div class="sub">세부업무(lv6) 기준 현황입니다. lv7 단위작업 값은 부모 lv6 으로 롤업됩니다. '
      + '<b>KPI·막대를 클릭하면</b> 오른쪽 목록이 그 업무들로 좁혀집니다.</div>'
      + '<div class="metricgrid five" style="margin-top:16px">' + kpis + "</div>"
      + deptFilterBar()
      + '<div class="sumgrid"><div>' + UNIT_NOTE + charts + "</div>" + sumSide() + "</div></div></div>";
  }

  /** 상세 패널 잠금 배너 — 왜 못 고치는지 화면에서 말해준다(회색으로만 두면 고장으로 읽힌다). */
  function lockBanner(n) {
    if (canEdit(n)) return "";
    var why = hasDetail(n.level)
      ? "이 업무의 소속(" + esc(deptsOf(n).join(", ")) + ")이 편집 범위 밖입니다."
      : "여러 과가 함께 쓰는 상위 분류라 잠겼습니다 — 고치면 남의 업무 경로까지 바뀝니다."
        + " (아래에 다른 소속 업무가 있어 화면에는 안 보일 수 있습니다.)";
    return '<div class="warn" style="margin:0 0 12px">🔒 <b>읽기 전용</b> · ' + why
      + " 상단 <b>편집 범위</b>를 바꾸면 수정할 수 있습니다.</div>";
  }

  /** 이 노드 아래의 lv6(집계 기준) 전부 — "이 분류를 어느 과가 쓰는가" 판정에 쓴다. */
  // 자손 lv6 목록 — 편집 범위 판정(canEdit/inEditScope)이 lv3~lv5 마다 부른다.
  // 예전엔 노드마다 서브트리를 훑고 `st.concat` 으로 배열을 재할당해 O(S²)였다.
  // 인덱스와 같은 버전 가드로 **1패스 bottom-up** 계산한다.
  var _dlnCache = null, _dlnVer = -1;
  function descLoadNodes(id) {
    if (_dlnVer !== _treeVer || !_dlnCache) {
      var m = Object.create(null), i, n;
      for (i = 0; i < S.nodes.length; i++) m[S.nodes[i].id] = [];
      var ord = S.nodes.slice().sort(function (a, b) { return (b.level || 0) - (a.level || 0); });
      for (i = 0; i < ord.length; i++) {
        n = ord[i];
        if (!(n.parent_id in m)) continue;
        var mine = m[n.id];
        if (isLoadLevel(n.level)) m[n.parent_id].push(n);
        for (var j = 0; j < mine.length; j++) m[n.parent_id].push(mine[j]);
      }
      _dlnCache = m; _dlnVer = _treeVer;
    }
    return _dlnCache[id] || _NOKIDS;
  }
  /** 편집 범위 필터가 켜져 있는가. */
  function scopeOn() { return !!(S.eGroup || S.eDept); }
  /** 이 lv6·lv7 이 지금 선택한 부서/과에 속하는가. */
  function inScope(n) {
    return S.eDept ? deptsOf(n).indexOf(S.eDept) >= 0 : deptGroupsOf(n).indexOf(S.eGroup) >= 0;
  }
  /** ★ 편집 권한 게이트 — 이 함수 하나가 정본이다.
   *
   *  필터가 없으면 전부 허용(기존 동작 그대로). 걸리면:
   *   · lv6·lv7 — 소속(depts)이 필터에 맞아야 한다.
   *   · lv3~lv5 — 소속 필드가 없는 **공용 분류**다. 아래 lv6 이 전부 내 소속이면 허용하고,
   *     다른 과가 섞여 있으면 잠근다 — 내가 이름을 고치면 남의 업무 경로까지 함께 바뀐다.
   *     자손이 없는 빈 분류(방금 만든 것)는 허용해야 한다. 안 그러면 만들자마자 못 고친다.
   */
  function canEdit(n) {
    if (!n) return false;
    if (!scopeOn()) return true;
    if (hasDetail(n.level)) return inScope(n);
    var kids = descLoadNodes(n.id);
    return !kids.length || kids.every(inScope);
  }
  /** 편집 범위가 켜졌을 때 **화면에 보일지**. 범위 밖은 아예 숨긴다.
   *
   *  lv3~lv5 는 소속이 없으므로 **내 소속 lv6 에 닿는 가지만** 남긴다(excel_io._branches_with_detail
   *  과 같은 발상). 자손 lv6 이 없는 빈 분류는 보여준다 — 방금 만든 것일 수 있고, 안 그러면
   *  새 대분류를 만드는 순간 화면에서 사라진다.
   *
   *  ★ 숨기는 것은 **렌더링뿐**이다. S.nodes 는 그대로라 저장 시 숨은 노드도 전부 함께 올라간다
   *    (프론트가 트리 전체를 보내는 v2 구조). 이 전제가 깨지면 남의 업무가 통째로 지워진다. */
  function inEditScope(n) {
    if (!scopeOn()) return true;
    if (hasDetail(n.level)) return inScope(n);
    var kids = descLoadNodes(n.id);
    return !kids.length || kids.some(inScope);
  }
  /** 화면에 그릴 자식만. childrenOf 는 저장·집계도 쓰므로 **렌더 경로에서만** 이걸 쓴다. */
  function visibleChildren(pid) { return childrenOf(pid).filter(inEditScope); }

  /** 화면에 그릴 **부문 목록**.
   *
   *  ★ 편집 범위(부서/과)가 켜져 있으면 **부문 칩 선택을 무시하고 전 부문**을 대상으로 한다.
   *    이 필터의 목적이 "내 과 업무가 어느 부문에 흩어져 있든 한 화면에 다 보기" 이기 때문이다.
   *    부문 칩은 범위가 꺼져 있을 때의 탐색 수단이고, 범위가 켜지면 소속이 곧 필터가 된다.
   *  범위가 꺼져 있으면 예전대로 칩으로 고른 부문만. */
  function pickedLv3() {
    var all = childrenOf(ROOT);
    return scopeOn() ? all.filter(inEditScope)
                     : all.filter(function (n) { return S.lv3Sel.indexOf(n.id) >= 0; });
  }

  /** 이 **제출값 레코드**를 고칠 수 있는가.
   *  노드 게이트(canEdit)를 먼저 통과해야 하고, 편집 범위가 걸려 있으면 **그 과의 행만** 허용한다.
   *  ★ 게이트 '장소' 를 늘리지 않는다 — 판정만 여기 두고, 실제 차단은 기존 세 지점(onClick/
   *    applyInput/onChange)에 절 하나씩 얹는다(CLAUDE.md 계약). */
  function canEditSub(n, rec) {
    if (!n || !rec || !canEdit(n)) return false;
    if (!scopeOn()) return true;
    return S.eDept ? rec.dept === S.eDept : deptParent(rec.dept) === S.eGroup;
  }
  function canEditSubIdx(id, idx) {
    var n = byId(id), r = n && (n.submissions || [])[idx];
    return !!r && canEditSub(n, r);
  }
  function subLockMsg() {
    return "🔒 " + (S.eDept || S.eGroup) + " 의 제출값만 고칠 수 있습니다";
  }
  function lockMsg() {
    return "🔒 " + (S.eDept || S.eGroup) + " 범위 밖입니다 — 상단에서 편집 범위를 바꾸세요";
  }

  /** 과별 제출값 1건 편집 블록(아코디언). 표 7열 안에 칩을 넣으면 폭이 무너져 아래로 펼친다.
   *
   *  ★ 편집 대상에서 **일부러 뺀 것**: `count`(인원 수정 = 통계 위조이고 sum(count)==submit_count
   *    불변식이 깨진다), `occur_pattern`/`events`/`apply_phases`(개인 배포판 입력 전용이고
   *    events 는 줄 수가 곧 호선당 횟수라 편집 표면이 크다), 행 추가(취합 산출물이다).
   *  ★ 두 가지 비대칭을 여기서 말해준다 — 없으면 문의가 반드시 온다. */
  function subEditBlock(n, r, idx) {
    var id = esc(n.id), ix = String(idx);
    var seg = function (label, inner) { return '<div><div class="fl">' + label + "</div>" + inner + "</div>"; };
    var autoOpts = ['<option value="">— 선택 —</option>'].concat(
      (S.domains.automation_level || []).map(function (v) {
        return '<option value="' + esc(v) + '"' + (r.automation_level === v ? " selected" : "") + ">" + esc(v) + "</option>";
      })).join("");
    var freqChips = FREQ_UNIT_KEYS.map(function (u) {
      return '<button class="tchip' + (r.freq_unit === u ? " on" : "") + '" data-act="subfreq" data-id="' + id
        + '" data-idx="' + ix + '" data-v="' + esc(u) + '">' + esc(u) + "</button>";
    }).join("");
    var techChips = function (key, sel) {
      return (S.domains.tech || []).map(function (t) {
        var on = (sel || []).indexOf(t) >= 0;
        return '<button class="tchip' + (on ? " on" : "") + '" data-act="subtech" data-id="' + id
          + '" data-idx="' + ix + '" data-k="' + esc(key) + '" data-v="' + esc(t) + '">' + esc(t) + "</button>";
      }).join("");
    };
    return '<div class="subedit"><div style="font-size:13.5px;font-weight:800;color:#0f766e;margin-bottom:10px">'
      + "✎ " + esc(r.dept) + (r.author ? " · " + esc(maskName(r.author)) : "") + " 의 제출값을 고칩니다</div>"
      + '<div class="segrid">'
      + seg("1회 소요시간(h)", '<input class="fi" data-fkey="sub_work_hours" data-id="' + id + '" data-idx="' + ix
            + '" value="' + esc(r.work_hours || "") + '" placeholder="예: 0.5" />')
      + seg("단위당 횟수", '<input class="fi" data-fkey="sub_freq_count" data-id="' + id + '" data-idx="' + ix
            + '" value="' + esc(r.freq_count || "") + '" placeholder="예: 3" />')
      + seg("자동화 수준", '<select class="fs" data-fkey="sub_automation_level" data-id="' + id + '" data-idx="' + ix + '">' + autoOpts + "</select>")
      + "</div>"
      + '<div style="margin-top:12px">' + seg("기간 단위 <span style=\'color:#a8a29e;font-weight:600\'>· 택1</span>",
            '<div class="techrow">' + freqChips + "</div>") + "</div>"
      + '<div style="margin-top:12px">' + seg("활용기술 — 현재", '<div class="techrow">' + techChips("tech", r.tech) + "</div>") + "</div>"
      + '<div style="margin-top:12px">' + seg("활용기술 — 향후", '<div class="techrow">' + techChips("future_tech", r.future_tech) + "</div>") + "</div>"
      + '<div class="warn" style="margin-top:12px;font-size:13px">'
      + "· 이 값은 <b>과별 비교</b>에만 반영됩니다. 상단 KPI·AI 적용률은 <b>대표값</b> 기준이라 바뀌지 않습니다.<br/>"
      + "· <b>다음 취합 스캔에서 제출본 값으로 다시 덮어씁니다</b>(한 회차 = 그 시점의 진실). "
      + "영구히 바꾸려면 제출본을 고쳐 다시 받으세요.</div>"
      + '<div style="display:flex;gap:8px;margin-top:12px">'
      + '<button class="minibtn" data-act="subclose">닫기</button>'
      + '<button class="minibtn" style="color:#b91c1c" data-act="subdel" data-id="' + id + '" data-idx="' + ix + '">🗑 이 제출값 삭제</button>'
      + "</div></div>";
  }

  /** 부하 표시 문자열 — loadOf 의 kind 를 그대로 살린다.
   *  ★ 연간(상시)과 호선당(이벤트)을 한 숫자로 뭉치면 거짓이다. 호선루틴은 '보류'로 적는다. */
  function loadLabel(r) {
    var ld = loadOf(r);
    if (ld.kind === "unresolved") return "호선루틴 보류";
    if (!ld.hours) return "—";
    return ld.hours + (ld.kind === "per_ship" ? "h/호선" : "h/년");
  }
  /** 과별 제출값 표 (메인앱 전용, **읽기전용**).
   *
   *  대표값(노드 본체)은 '첫 제출자 승리'라 여러 과가 같은 업무를 해도 소요시간·주기가 하나만
   *  남는다. 이 표는 취합이 보존한 **과마다 다른 원본**(node.submissions)을 그대로 보여준다.
   *  옛 트리·엑셀 왕복본에는 submissions 가 없고 submit_detail 텍스트만 있어, 호출 측이 폴백한다. */
  function submissionsTable(n) {
    var recs = (n.submissions || []).filter(function (r) { return r && r.dept; });
    if (!recs.length) return "";
    var head = '<div class="subrow subhead"><span>과</span><span>제출자</span><span>인원</span><span>1회</span>'
             + "<span>주기</span><span>부하</span><span>자동화</span><span>활용기술</span></div>";
    var pick = (S.subEdit && S.subEdit.id === n.id) ? S.subEdit.idx : -1;
    if (pick >= 0 && !recs[pick]) pick = -1;                 // 삭제·재취합으로 밀린 stale 방어
    var rows = recs.map(function (r, i) {
      var ok = canEditSub(n, r);
      var freq = r.freq_unit ? (r.freq_unit + " " + (r.freq_count || "") + "회")
               : (occurOf(r) === OCCUR.SHIP_EVENT ? ((r.events || []).length + "개 시점") : "—");
      var techs = (r.tech || []).concat((r.future_tech || []).map(function (t) { return t + "(향후)"; }));
      var row = '<div class="subrow' + (ok ? " editable" : " ro") + (i === pick ? " picked" : "") + '"'
        + (ok ? ' data-act="subpick" data-id="' + esc(n.id) + '" data-idx="' + i + '" title="클릭하면 이 행을 고칩니다"' : ' title="편집 범위 밖입니다"')
        + ">"
        + "<span><b>" + esc(r.dept) + '</b><br><span style="color:#a8a29e;font-size:12px">'
        + esc(deptParent(r.dept)) + "</span></span>"
        // 제출자 — **출력은 마스킹**한다(pii 원칙: 저장 원본·출력 마스킹). 편집 대상이 아니라 행 라벨이다.
        + "<span>" + (r.author ? esc(maskName(r.author)) : '<span style="color:#d6d3d1">—</span>') + "</span>"
        + "<span>" + esc(String(r.count || 1)) + "명</span>"
        + "<span>" + (r.work_hours ? esc(r.work_hours) + "h" : "—") + "</span>"
        + "<span>" + esc(freq) + "</span>"
        + "<span>" + esc(loadLabel(r)) + "</span>"
        + "<span>" + esc(r.automation_level || "—") + "</span>"
        + "<span>" + (techs.length ? esc(techs.join(", ")) : "—") + (ok ? ' <span style="color:#0f766e">✎</span>' : "") + "</span></div>";
      return row + (i === pick ? subEditBlock(n, r, i) : "");
    }).join("");
    // 대표값 vs 과별 합계 — **다른 게 정상**임을 여기 적어둔다. 요약 탭 UNIT_NOTE 와 같은 이유로,
    // 이 문구가 없으면 "숫자가 안 맞는다"는 문의가 반드시 나온다.
    var rep = loadOf(n), sum = 0, any = false;
    recs.forEach(function (r) {
      var l = loadOf(r);
      if (l.kind === rep.kind && l.hours) { sum += l.hours; any = true; }
    });
    sum = Math.round(sum * 10) / 10;
    var unit = rep.kind === "per_ship" ? "h/호선" : "h/년";
    var note = (rep.kind === "unresolved" || !any) ? ""
      : '<div class="warn" style="margin-top:8px">대표값 <b>' + rep.hours + unit
        + "</b> · 과별 제출 합계 <b>" + sum + unit + "</b> — 대표값은 <b>첫 제출자 1명분</b>이고 "
        + "합계는 <b>수행 과 전부의 합</b>이라 다른 것이 정상입니다.</div>";
    return '<div style="margin-top:12px"><div class="fl">🏢 과별 제출값 '
      + '<span style="color:#a8a29e;font-weight:600">· ' + recs.length
      + "건 제출 (소속은 스캔 폴더 기준 · <b>행을 클릭하면 고칠 수 있습니다</b>)</span></div>"
      + '<div class="cardbox">' + head + rows + "</div>" + note + "</div>";
  }

  // 도메인 배지 카운트용 — **sumNodes 의 축 분기와 1:1 로 맞춰야 한다.**
  // 한쪽만 고치면 "배지 7개인데 목록엔 3개" 가 부활한다(그래서 여기 나란히 둔다).
  var AXIS_VALS = {
    dept: function (n) { return deptsOf(n); },
    dept_group: function (n) { return deptGroupsOf(n); },
    automation: function (n) { return [n.automation_level || "(미지정)"]; },
    tech_now: function (n) { return rollupTechs(n, "tech"); },
    tech_future: function (n) { return rollupTechs(n, "future_tech"); },
    ship_type: function (n) { return rollupList(n, "ship_types"); },
    special_note: function (n) { return rollupList(n, "special_note"); },
    linked_system: function (n) { return rollupSystems(n); },
  };
  // 축 → 그 값이 들어 있는 도메인 키 (활용기술 두 축은 tech 하나를 공유한다)
  var DOM_SRC = { tech_now: "tech", tech_future: "tech", automation: "automation_level" };

  /** 요약 드릴다운 — 선택한 집계 칸에 속한 lv6 목록.
   *  ★ 필터는 stats() 가 쓰는 게이트(isLoadLevel/rollupHasAi/rollupTechs)를 **그대로** 재사용한다.
   *    별도 조건을 새로 쓰면 표의 숫자와 목록 개수가 조용히 어긋난다. */
  function sumNodes(axis, key) {
    var out = S.nodes.filter(function (n) {
      if (!isLoadLevel(n.level)) return false;
      // 부서/과 필터를 **먼저** 건다. 기존 axis 분기는 한 줄도 건드리지 않는다 —
      // stats() 와 게이트를 공유해야 표의 숫자와 목록 개수가 어긋나지 않기 때문이다.
      if (S.fDept && deptsOf(n).indexOf(S.fDept) < 0) return false;
      if (S.fGroup && deptGroupsOf(n).indexOf(S.fGroup) < 0) return false;
      if (axis === "all") return true;
      if (axis === "hours") return true;                     // 전체 — 정렬만 다르다
      if (axis === "missing") return rollupHours(n) <= 0 && !isShipRoutine(n);
      if (axis === "unresolved") return rollupHours(n) <= 0 && isShipRoutine(n);
      if (axis === "ai_now") return rollupHasAi(n);
      if (axis === "ai_future") return rollupHasAi(n, "has_ai_future");
      if (axis === "dept_ai_now") return deptsOf(n).indexOf(key) >= 0 && rollupHasAi(n);
      if (axis === "dept_ai_future") return deptsOf(n).indexOf(key) >= 0 && rollupHasAi(n, "has_ai_future");
      // 막대의 '미적용' 구간 — AI 구간과 합치면 그 과의 전체가 된다(막대 2구간의 전제)
      if (axis === "dept_ai_none_now") return deptsOf(n).indexOf(key) >= 0 && !rollupHasAi(n);
      if (axis === "dept_ai_none_future") return deptsOf(n).indexOf(key) >= 0 && !rollupHasAi(n, "has_ai_future");
      if (axis === "dept") return deptsOf(n).indexOf(key) >= 0;
      if (axis === "dept_group") return deptGroupsOf(n).indexOf(key) >= 0;
      if (axis === "automation") return (n.automation_level || "(미지정)") === key;
      if (axis === "tech_now") return rollupTechs(n, "tech").indexOf(key) >= 0;
      if (axis === "tech_future") return rollupTechs(n, "future_tech").indexOf(key) >= 0;
      // 도메인 관리 드릴다운용 — lv7 값은 부모 lv6 으로 롤업해 기술 축과 기준을 맞춘다
      if (axis === "ship_type") return rollupList(n, "ship_types").indexOf(key) >= 0;
      if (axis === "special_note") return rollupList(n, "special_note").indexOf(key) >= 0;
      if (axis === "linked_system") return rollupSystems(n).indexOf(key) >= 0;
      return false;
    });
    // 부하 카드는 "어느 업무가 시간을 먹는가"를 보려는 것이라 큰 순으로 준다.
    if (axis === "hours") out.sort(function (a, b) { return rollupHours(b) - rollupHours(a); });
    return out;
  }
  /** 우측 목록. 선택이 없으면 **전체 lv6** 을 보여준다(빈 안내판보다 쓸모 있다). */
  function sumSide() {
    var p = S.sumPick || { axis: "all", key: "" };
    var AX = { all: "전체 세부업무", hours: "연간 공수 큰 순", missing: "부하 미입력",
               unresolved: "호선루틴 보류 (구간길이 미상)",
               ai_now: "AI 적용 — 현재", ai_future: "AI 적용 — 향후", dept: "과", dept_group: "부서",
               dept_ai_now: "AI 적용(현재) · 과", dept_ai_future: "AI 적용(향후) · 과",
               dept_ai_none_now: "AI 미적용(현재) · 과", dept_ai_none_future: "AI 미적용(향후) · 과",
               automation: "자동화 수준", tech_now: "활용기술 — 현재", tech_future: "활용기술 — 향후",
               ship_type: "적용 선종", special_note: "특이사항", linked_system: "연계시스템" };
    var list = sumNodes(p.axis, p.key);
    var title = (AX[p.axis] || p.axis) + (p.key ? " · " + p.key : "");
    // ★ 목록 상한 — 예전엔 선택이 없으면 lv6 **전부**(수천 행)를 그렸다. 그리는 비용도 크지만
    //   스크롤로 훑을 수도 없는 양이다. 잘랐다는 사실을 아래 안내로 **반드시 밝힌다**
    //   (조용히 자르면 "왜 우리 과 업무가 없지" 가 된다 — 공통규칙: 침묵 절단 금지).
    var SIDE_MAX = 300;
    var shown = list.length > SIDE_MAX ? list.slice(0, SIDE_MAX) : list;
    var rows = shown.map(function (n) {
      // 좌: lv6 이름 + 상위 경로 / 우: 소속·부하·AI 칩 (넓어진 폭을 쓰려고 2열)
      var up = pathNames(n.id).slice(3, -1).join(" › ");
      var techs = rollupTechs(n, "tech"), ftechs = rollupTechs(n, "future_tech");
      var h = rollupHours(n);
      var ds = deptsOf(n);          // 여러 과가 하는 업무면 전부 보여준다
      // AI 판정은 **stats() 와 같은 함수**를 쓴다 — 안 그러면 막대 숫자와 목록이 어긋난다
      var aiNow = rollupHasAi(n), aiFut = rollupHasAi(n, "has_ai_future");
      var chips = (aiNow ? '<span class="aichip now" title="' + esc(techs.join(", ")) + '">🤖 현재</span>' : "")
                + (aiFut ? '<span class="aichip fut" title="' + esc(ftechs.join(", ")) + '">🤖 향후</span>' : "")
                + (!aiNow && !aiFut ? '<span class="aichip off">미적용</span>' : "");
      // 과 필터가 걸려 있고 그 과의 제출값이 있으면 **그 과 값**으로 보여준다 —
      // 대표값(첫 제출자)을 그대로 두면 "우리 과는 0.5h 로 냈는데 왜 2h 로 보이지"가 된다.
      var rec = S.fDept ? (n.submissions || []).filter(function (r) { return r && r.dept === S.fDept; })[0] : null;
      var meta = rec
        ? [S.fDept, loadLabel(rec), rec.automation_level || ""].filter(Boolean).join(" · ") + " · 제출값"
        : [ds.join(", "),
           h ? h + "h/년" : (isShipRoutine(n) ? "호선루틴 보류" : "부하 미입력")].filter(Boolean).join(" · ");
      var techLine = [techs.length ? "현재 " + techs.join(", ") : "",
                      ftechs.length ? "향후 " + ftechs.join(", ") : ""].filter(Boolean).join(" · ");
      return '<div class="sumrow" data-act="gonode" data-id="' + esc(n.id) + '" title="클릭하면 계층 편집에서 이 업무를 엽니다">'
        + '<div class="sleft"><div class="sp">' + esc(n.name || "이름 없음") + "</div>"
        + (up ? '<div class="spath">' + esc(up) + "</div>" : "")
        + (techLine ? '<div class="sm">' + esc(techLine) + "</div>" : "") + "</div>"
        + '<div class="sright">' + chips + '<span class="sm">' + esc(meta) + "</span></div></div>";
    }).join("");
    var fTag = (S.fGroup || S.fDept)
      ? '<span style="color:#0f766e;font-weight:700">🏢 ' + esc([S.fGroup, S.fDept].filter(Boolean).join(" › ")) + "</span>"
      : "";
    return '<div class="sumside"><div class="sumhead"><b>' + esc(title) + "</b>" + fTag
      + '<span>' + list.length + '개</span>'
      + (S.sumPick ? '<button class="sumx" data-act="sumclose" title="전체 보기로">✕</button>' : "") + "</div>"
      + '<div class="sumlist">' + (rows || '<div class="sumrow" style="color:#a8a29e">해당 업무가 없습니다.</div>')
      + (list.length > shown.length
          ? '<div class="sumrow" style="color:#a8a29e;justify-content:center">… ' + list.length + "개 중 "
            + shown.length + "개만 표시합니다 · KPI·막대를 눌러 범위를 좁히거나 검색을 쓰세요</div>"
          : "")
      + "</div></div>";
  }

  /** 이름 붙인 보관본 — '2026-08 1차 취합' 처럼 사람이 의미를 붙여 남기는 기준점.
   *  자동 스냅샷(이력)과 **목적이 다르다**: 이력은 덮어쓰기 직전 상태를 기계가 남기는 안전망이라
   *  90일·최신 50개로 자동 정리되지만, 보관본은 자동 삭제되지 않는다.
   *  ★ 불러오기는 **화면에만** 올린다(정본은 [저장]을 눌러야 바뀐다) — 실수로 눌러도 되돌릴 수 있게. */
  function pageSaves() {
    var list = S.saves || [];
    var canSave = !!S.author && !!String(S.saveName || "").trim();
    // 같은 이름이 이미 있으면 "다음 버전으로 쌓인다"고 미리 알린다 — 덮어쓰기가 아님을 버튼 옆에서 못박는다.
    var cur = list.filter(function (g) { return g.name === String(S.saveName || "").trim(); })[0];
    var nextHint = cur ? " → v" + (cur.latest_version + 1) + " 로 추가됩니다" : "";
    var head = '<div style="font-size:15.5px;font-weight:800;margin:24px 0 6px">🔖 이름 붙인 보관본</div>'
      + '<div style="font-size:13.5px;color:#a8a29e;line-height:1.6;margin-bottom:10px">'
      + '버전·시나리오를 이름으로 남깁니다. <b>같은 이름으로 다시 보관하면 덮어쓰지 않고 다음 버전이 쌓입니다.</b> '
      + '위의 자동 이력과 달리 자동으로 지워지지 않고, 불러오면 화면에만 반영되어 상단 [저장]을 눌러야 정본이 바뀝니다.</div>'
      + '<div class="cardbox" style="padding:14px">'
      + '<div style="display:flex;gap:8px;align-items:center">'
      + '<input class="fi" style="flex:1;font-size:14.5px" data-fkey="savename" value="' + esc(S.saveName || "")
      + '" placeholder="예: 2026 상반기안 / AI적용 시나리오A" />'
      + '<button class="' + (canSave ? "primary" : "")
      + '" style="' + (canSave ? "" : "background:#cabfb0;color:#fff;border:none;border-radius:9px;cursor:not-allowed;font-weight:800;")
      + 'flex:none;padding:9px 18px" data-act="saveas">현재 내용 보관</button></div>'
      + (nextHint ? '<div style="font-size:13px;color:#0f766e;margin-top:8px">🔖 같은 이름의 계보가 있습니다' + esc(nextHint) + "</div>" : "")
      + (S.author ? "" : '<div class="warn" style="margin-top:10px">보관하려면 상단에 저장자를 입력하세요.</div>')
      + "</div>";
    if (!list.length) {
      return head + '<div class="cardbox" style="padding:22px;margin-top:12px;text-align:center;color:#a8a29e;font-size:14.5px">'
        + "아직 보관본이 없습니다. 이름을 적고 [현재 내용 보관] 을 누르세요.</div>";
    }
    var rows = list.map(function (g) {
      var open = S.saveOpen === g.name;
      var main = '<div class="saverow">'
        + '<span style="font-weight:700;color:#44403c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'
        + esc(g.name) + '">' + esc(g.name) + "</span>"
        + '<span><button class="sbtn vbtn" data-act="savesopen" data-name="' + esc(g.name) + '" title="버전 목록">'
        + "v" + esc(g.latest_version) + " · " + esc(g.n_versions) + "개 " + (open ? "▾" : "▸") + "</button></span>"
        + '<span style="color:#78716c">' + esc(g.ts || "—") + "</span>"
        + '<span style="color:#a8a29e">' + esc(g.n_nodes) + "개</span>"
        + '<button class="sbtn" data-act="savesload" data-name="' + esc(g.name) + '" data-v="'
        + esc(g.latest_version) + '" data-n="' + esc(g.n_nodes) + '">최신 불러오기</button>'
        + '<button class="sbtn del" data-act="savesdel" data-name="' + esc(g.name)
        + '" title="이 이름의 모든 버전 삭제">🗑</button></div>';
      if (!open) return main;
      // 버전 목록 — 최신순. 각 버전을 따로 불러오거나 지울 수 있다.
      var vs = (g.versions || []).map(function (v) {
        return '<div class="verrow"><span>v' + esc(v.version) + "</span>"
          + '<span style="color:#78716c">' + esc(v.ts || "—") + "</span>"
          + '<span style="color:#78716c">' + esc(maskName(v.author || "")) + "</span>"
          + '<span style="color:#a8a29e">' + esc(v.n_nodes) + "개</span>"
          + '<button class="sbtn" data-act="savesload" data-name="' + esc(g.name) + '" data-v="' + esc(v.version)

  function rerender(focusSel) {

    // 한 자 칠 때마다 커서가 맨 뒤로 튄다.
    var caret = null;
    if (focusSel) {
      var prev = contentEl.querySelector(focusSel);
      if (prev && prev === document.activeElement) {
        try { caret = { s: prev.selectionStart, e: prev.selectionEnd }; } catch (e) {}
      }
    }
    touchTree();                 // 렌더 진입 시 인덱스를 버린다 — 직전까지의 모든 변경을 덮는 안전망
    contentEl.innerHTML = fullView();
    wireDnD();          // innerHTML 로 DOM 을 갈아끼웠으므로 Sortable 을 다시 붙인다
    layout();
    if (focusSel) {
      var el = contentEl.querySelector(focusSel);
      if (el) {
        el.focus();
        try {
          if (caret) el.setSelectionRange(caret.s, caret.e);
          else el.setSelectionRange(el.value.length, el.value.length);
        } catch (e) {}

  var H_MIN = 560, H_MAX = 900;     // 프레임 높이 하한/상한 (아래 needHeight 참조)
  /** 지금 화면이 실제로 필요로 하는 높이(px).
   *
   *  예전엔 항상 820 고정이었다 — 카드가 몇 장뿐이어도 컬럼이 820px 까지 늘어나
   *  **화면 아래가 통째로 비었다.** 이제 콘텐츠를 재서 clamp 한다.
   *  상한을 두는 이유: iframe 은 scrolling:"no" 라 내부(.list/.page)가 스크롤을 맡아야 하는데,
   *  무한정 키우면 Streamlit 페이지 자체가 길어져 헤더가 화면 밖으로 밀린다.
   */
  /** 스크롤 상자가 "콘텐츠만으로" 필요한 높이.
   *
   *  ★ scrollHeight 를 쓰면 안 된다 — 콘텐츠가 상자보다 짧아도 scrollHeight 는 절대
   *    clientHeight 아래로 안 내려간다. 그러면 "지금 높이 이상"만 나와서 프레임이
   *    **한 번 커지면 영영 안 줄어드는 래칫**이 된다(실제로 상한 900 에 눌러붙었다).
   *    그래서 자식들의 실제 높이를 직접 더한다.
   */
  function innerNeed(el) {
    var cs = getComputedStyle(el);
    var h = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    var kids = el.children;
    for (var i = 0; i < kids.length; i++) {
      var ks = getComputedStyle(kids[i]);
      h += kids[i].offsetHeight + (parseFloat(ks.marginTop) || 0) + (parseFloat(ks.marginBottom) || 0);
    }
    var gap = parseFloat(cs.rowGap) || 0;
    if (kids.length > 1 && gap) h += gap * (kids.length - 1);
    return h;
  }
  function needHeight() {
    // 스크롤을 맡는 안쪽 상자들. 바깥 상자는 프레임 높이에 맞춰 늘어나므로 재봐야 소용없다.
    var INNER = ".list, .pbody, .page";
    var total = 0;
    Array.prototype.forEach.call(contentEl.children, function (ch) {
      var inner = ch.matches && ch.matches(INNER) ? [ch] : (ch.querySelectorAll ? ch.querySelectorAll(INNER) : []);
      if (!inner.length) { total += ch.offsetHeight; return; }   // 헤더·배너 등 고정 블록
      // 이 블록의 필요 높이 = 자기 높이 + (안쪽 콘텐츠 - 안쪽 상자). 안쪽이 여럿이면
      // (컬럼 보드) 가장 많이 필요한 것을 따른다.
      // ★ extra 는 **음수가 될 수 있다** — 콘텐츠가 상자보다 짧으면 그만큼 줄여야 한다.
      //   0 으로 초기화하면 줄어들 길이 막혀 프레임이 상한에 눌러붙는다.
      var extra = null;
      Array.prototype.forEach.call(inner, function (el) {
        var e = innerNeed(el) - el.offsetHeight;
        if (extra === null || e > extra) extra = e;
      });
      total += ch.offsetHeight + (extra || 0);
    });
    if (!total) total = 700;
    return Math.max(H_MIN, Math.min(H_MAX, Math.round(total + 8)));
  }
  function layout() {

    if (!IN_ST || !contentEl) return;
    var h = needHeight();
    contentEl.style.height = h + "px";
    setHeight(h + 4);
  }

      rd.readAsDataURL(file);
    }
    if (f === "jsonup") {            // 개인 모드 — 이어서 작성하기
      var jf = el.files && el.files[0]; if (!jf) return;
      var jr = new FileReader();
      jr.onload = function () { emit({ type: "import_local", text: String(jr.result) }); };
      jr.readAsText(jf, "utf-8");
    }
    if (f === "collectfiles") {       // 취합 — 여러 .json 을 한 번에 읽어 배열로 보낸다
      if (!needIdent()) { el.value = ""; return; }        // 부서·이름 먼저
      var fl = el.files ? [].slice.call(el.files) : []; if (!fl.length) return;
      var out = [], done = 0;
      flash(fl.length + "개 파일을 읽는 중…");
      fl.forEach(function (file, i) {
        var rd = new FileReader();
        rd.onload = function () {
          out[i] = { name: file.name, b64: String(rd.result).split(",")[1] || "" };
          if (++done === fl.length) emit({ type: "collect_scan", files: out });
        };
        rd.readAsDataURL(file);
      });
    }
  }

  // ── 초기화 / Streamlit 렌더 수신 ────────────────────
  function applyArgs(args) {
    // ★ 트리는 epoch 이 바뀔 때만 갈아끼운다. 매 렌더마다 덮으면 download·histpick 같은
    //   조회성 왕복에도 화면이 저장본으로 되돌아가 미저장 편집이 조용히 사라진다.
    var ep = args.tree_epoch;
    if (args.tree && (S.treeEpoch === null || ep !== S.treeEpoch)) {
      S.treeEpoch = ep;
      S.nodes = canonNodes((args.tree.nodes || []).map(function (n) { return Object.assign({}, n); }));
      S.domains = withDefaultDomains(args.tree.domains); recalcAi();   // 새 도메인 기본값 병합 + AI 파생 재계산
      S.rev = args.tree.rev || 0;
      S.dirty = [];             // 파이썬이 준 새 정본 = 미저장 변경 없음
      if (args.dirty_all) S.dirty = S.nodes.map(function (n) { return n.id; }).concat(["dom"]);  // 엑셀 반영 직후: 전부 미저장
      // 새 트리에 없는 노드를 가리키던 선택은 버린다 (복원·엑셀 반영 후)
      if (S.selectedId && !byId(S.selectedId)) { S.selectedId = null; S.sel = {}; }
      else if (S.selectedId) selectPath(S.selectedId);
    } else if (args.tree) {
      S.rev = args.tree.rev || 0;   // 저장 충돌 판정용 rev 는 항상 최신으로
    }
    if (typeof args.author === "string" && args.author) S.author = args.author;
    if (Array.isArray(args.saves)) S.saves = args.saves;
    S.env = args.env || "";
    S.history = args.history || [];
    S.audit = args.audit || [];
    S.conflict = args.conflict || null;
    S.diskNewer = args.disk_newer || null;
    S.diffPreview = args.diff_preview || null;
    S.importPreview = args.import_preview || null;
    S.importErrors = args.import_errors || [];
    S.collectPreview = args.collect_preview || null;
    S.collectErrors = args.collect_errors || [];
    // 취합 폴더 기본값 — **아직 손대지 않았을 때만** 채운다(사용자가 지운 값을 되살리지 않게).
    if (S.collectFolder == null && args.collect_folder_default) S.collectFolder = args.collect_folder_default;
    // 질의 챗봇 — 대화록의 정본은 파이썬이다(낙관적으로 그린 내 질문도 여기서 덮인다).
    S.chatReady = !!args.chat_ready;
    S.chatProvider = args.chat_provider || "";
    if (Array.isArray(args.chat_log)) { S.chatLog = args.chat_log; S.chatBusy = false; }
    if (S.activeTab === "chat" && !(S.chatReady && !SOLO)) S.activeTab = "tree";   // 탭이 사라지면 되돌린다
    if (!S.importPreview) S.delMissing = false;   // 다음 업로드에 삭제 옵션이 딸려가지 않게
    if (!S.collectPreview) S.pruneEmpty = true;   // 취합 옵션은 기본(켜짐)으로 되돌린다
    if (typeof args.flash === "string" && args.flash) flash(args.flash);
    if (S.histPick >= (S.history.length || 1)) S.histPick = 0;
  }
  function boot() {
    appEl = document.getElementById("app");
    appEl.className = "app";
    contentEl = document.createElement("div");
    contentEl.style.display = "flex";
    contentEl.style.flexDirection = "column";
    // Streamlit iframe 안에선 layout() 이 콘텐츠를 재서 높이를 정한다(H_MIN~H_MAX).
    // 단독 배포판은 뷰포트 전체를 채운다(큰 모니터에서 하단 여백이 크게 남지 않게).
    if (!IN_ST) document.documentElement.classList.add("solo");
    contentEl.style.height = IN_ST ? H_MIN + "px" : "100vh";   // 첫 렌더 전 임시값, 곧 layout() 이 덮는다
    appEl.appendChild(contentEl);
    appEl.addEventListener("click", onClick);
    appEl.addEventListener("input", onInput);
    appEl.addEventListener("change", onChange);
    appEl.addEventListener("keydown", onKeydown);
    // 한글 IME — 조합 중엔 rerender 를 멈춰야 자모가 낱낱이 확정되지 않는다
    appEl.addEventListener("compositionstart", onCompositionStart);
    appEl.addEventListener("compositionend", onCompositionEnd);
    rerender();
  }

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    IN_ST = true;
    try { applyArgs(e.data.args || {}); if (!appEl) boot(); else rerender(); }
    catch (err) { if (appEl) contentEl.innerHTML = '<div style="padding:20px;color:#b91c1c">화면 오류: ' + esc(err && err.message) + "</div>"; }
  });

  if (SOLO) {
    // 개인 배포판: 파이썬을 기다릴 이유가 없다. localStorage 초안이 있으면 이어서, 없으면 시드로.
    var saved = soloLoad();
    // build_standalone.py 가 과별 기본 골격을 주입할 수 있다(window.__PD_SEED__). 초안이 있으면
    // 시드는 무시하고 이어서 — 이미 작성 중인 사람의 작업분을 골격이 덮지 않게 한다.
    var seedDept = "";
    if (saved) {
      S.nodes = canonNodes(saved.nodes.map(coerceEvents)); S.domains = withDefaultDomains(saved.domains); recalcAi();   // 새 도메인 기본값 병합 + AI 파생 재계산
      S.dept = saved.dept || ""; S.author = saved.author || ""; S.exported = true;
    } else if (window.__PD_SEED__ && Array.isArray(window.__PD_SEED__.nodes) && window.__PD_SEED__.nodes.length) {
      var sd = window.__PD_SEED__;
      S.nodes = canonNodes(sd.nodes.map(function (n) { return coerceEvents(Object.assign({}, n)); }));
      S.domains = withDefaultDomains(sd.domains); recalcAi();   // 새 도메인 기본값 병합 + AI 파생 재계산
      S.dept = sd.dept || sd.exported_dept || "";   // 과 자동 지정(있으면)
      seedDept = S.dept;
    } else {
      S.nodes = soloSeed(); S.domains = JSON.parse(JSON.stringify(DEF_DOMAINS));
    }
    boot();
    if (saved) flash("이 브라우저에 저장해둔 작성분을 불러왔습니다");
    else if (seedDept) flash(seedDept + " 기본 골격으로 시작합니다 — 세부업무(lv6)를 채워 제출하세요");
  } else {
    // 디자인 단독 미리보기: 300ms 안에 Streamlit render 가 안 오면 목업으로 뜬다
    setTimeout(function () { if (!IN_ST) { S.nodes = seed(); S.domains = JSON.parse(JSON.stringify(DEF_DOMAINS)); S.history = MOCK_HIST; S.audit = MOCK_AUDIT; boot(); } }, 300);
    send({ type: "streamlit:componentReady", apiVersion: 1 });
  }
})();
</script>
</body>
</html>
